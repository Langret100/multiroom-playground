<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>던전 아레나</title><link rel="stylesheet" href="style.css"></head>
<body>
  <audio id="backgroundMusic" hidden preload="auto"></audio><canvas id="world" tabindex="0" aria-label="게임 화면"></canvas>
  <header id="hud" hidden><div class="brand"><span class="sigil">D</span><div><b>던전 아레나</b><small id="modeLabel"></small></div></div><div id="status" class="status"></div><div class="header-actions"><span id="timer">10:00</span><button id="mapToggle" title="M">전체 지도</button><button id="inventoryBtn" title="I / Tab">장비</button><button id="pauseBtn" title="설정 / 일시정지" aria-label="설정 / 일시정지">☰</button><button id="menuBtn">메뉴</button></div></header>
  <div id="objective" hidden></div><div id="bossHud" hidden></div><div id="bossIntro" hidden></div><section id="phaseBanner" hidden><div class="phase-banner-frame"><div id="phaseBannerTitle" class="phase-banner-title"></div><div id="phaseBannerSub" class="phase-banner-sub"></div><div id="phaseBannerTimer" class="phase-banner-timer" hidden><span id="phaseBannerTimeLabel"></span><div class="phase-banner-bar"><i id="phaseBannerTimeFill"></i></div></div></div></section><aside id="side" hidden><div class="panel-title"><b id="panelTitle">장비</b><button id="closeEquipment" aria-label="장비창 닫기">×</button></div><div id="inventory"></div><div id="masterTools" hidden></div></aside>
  <footer id="controls" hidden><div class="control-help"><b>WASD</b> 이동 · <b>Shift</b> 질주 · <b>E</b> 줍기 / 상자 · <b>I / Tab</b> 장비 · <b>M</b> 지도</div><div class="actions"><button id="dashBtn" aria-label="대쉬"><i class="action-symbol">➟</i>대쉬 <kbd>Shift</kbd><span class="dash-fill"></span></button><button id="attackBtn"><i class="action-symbol">⚔</i>공격 <kbd>Space / 클릭</kbd><span></span></button><button id="specialBtn"><i class="action-symbol">✦</i>특수 <kbd>Q / 우클릭</kbd><span></span></button></div></footer>
  <div id="renderStats" aria-label="렌더링 상태"></div><div id="notifications" aria-live="polite"></div>
  <div id="touchMove" aria-label="터치 이동 조이스틱"><i></i></div>
<section id="quizOverlay" class="overlay" hidden><form id="quizForm" class="modal"><div class="eyebrow">TREASURE CHEST</div><h2>잠금 해제</h2><p>계산하는 동안에도 게임은 진행됩니다.<br>다른 모험가가 먼저 상자를 열 수 있습니다.</p><div id="question"></div><input id="answer" inputmode="decimal" autocomplete="off" placeholder="정답 입력" aria-label="정답"><div id="quizFeedback" aria-live="polite"></div><div class="modal-actions"><button id="quizCancel" type="button">닫기</button><button type="submit" class="primary">열기</button></div></form></section>
  <section id="resultOverlay" class="overlay" hidden><div class="modal result"><div class="eyebrow">EXPEDITION COMPLETE</div><h2 id="resultTitle"></h2><p id="resultReason"></p><button id="resultMenuBtn">모드 선택</button></div></section>
  <div id="pauseOverlay" class="overlay" hidden><div class="modal"><h2>설정 / 일시정지</h2><p>온라인 경기에서는 설정을 열어도 게임이 계속 진행됩니다.</p><div class="game-settings"><label>맵 화질 <select id="mapQuality"><option value="1">표준</option><option value="0.8">가벼움</option><option value="0.65">최저 부하</option></select></label><label><input id="showFps" type="checkbox"> FPS 표시</label><label><input id="soundEnabled" type="checkbox" checked> 소리 켜기</label><label>음악 <input id="musicVolume" type="range" min="0" max="100" value="22"></label><label>효과음 <input id="effectsVolume" type="range" min="0" max="100" value="55"></label><label><input id="shakeEnabled" type="checkbox" checked> 타격 시 화면 흔들림</label><label><input id="rangeEnabled" type="checkbox" checked> 공격 범위 표시 [V]</label><label><input id="aimAssist" type="checkbox" checked> 모바일 가까운 적 자동 조준</label><small>Kenney / Memoraphile / HydroGene · CC0<br>음원 출처는 AUDIO-CREDITS.md에 기록했습니다.</small></div><button id="resumeBtn" class="primary">계속하기</button></div></div>
  <script type="module" src="client.mjs?v=20261005-dw-drop-size-v4"></script>
</body></html>
