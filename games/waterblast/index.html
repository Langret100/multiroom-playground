tom';ctx.fillText(p.nick,cx,cy-cell*.46);if(p.bubbled){ctx.font=`900 ${Math.max(10,cell*.16)}px sans-serif`;ctx.fillText(`${p.mash||0}/9`,cx,cy+cell*.53)}}const me=w.players?.[bridge.sid];if(me){statsEl.textContent=`🫧${me.maxBombs} · 📏${me.range} · 👟${Math.max(1,Math.round((me.speed-2.7)/.35))}${me.broomUntil>Date.now()?' · 🧹':''}`;statusEl.textContent=me.alive?(me.bubbled?'끈적한 슬라임! 이동키를 연타해 탈출!':me.dizzyUntil>Date.now()?'빙글빙글… 기절!':`KO ${me.kos} · ${bridge.isHost?'HOST':'PLAYER'}`):'탈락 · 결과를 기다리는 중'}const now=Date.now(),sec=Math.ceil(Math.max(0,w.endAt-now)/1000);timerEl.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(w.ended){const win=w.players?.[w.winnerSid];center.classList.remove('hidden');big.textContent=win?.sid===bridge.sid?'승리! 🏆':`${win?.nick||'플레이어'} 승리!`;small.textContent=`KO ${win?.kos||0} · 잠시 후 방으로 돌아갑니다.`}else if(now<w.startAt){center.classList.remove('hidden');big.textContent=String(Math.max(1,Math.ceil((w.startAt-now)/1000)));small.textContent='슬라임을 설치하고 물줄기를 피해 마지막까지 살아남으세요!'}else center.classList.add('hidden')}
function loop(t){const d=Math.min(.05,(t-lastFrame)/1000);lastFrame=t;acc+=d;if(bridge.isHost){if(!world&&bridge.ready)world=makeWorld();while(acc>=TICK/1000){simulate(TICK/1000,Object.assign({},guestInputs,{[bridge.sid]:input}),Date.now());acc-=TICK/1000}}else acc=0;sendState(t);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
