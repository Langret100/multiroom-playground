<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>⚽ 수학축구</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none;
      -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; background:#0b1220; overflow:hidden;
      font-family:'Segoe UI',system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #gc { background:#163f2a; display:block; touch-action:none; image-rendering:crisp-edges; image-rendering:pixelated;
      transform:translateZ(0); backface-visibility:hidden; box-sizing:content-box;
      border:3px solid #253653; box-shadow:0 18px 55px rgba(0,0,0,.55), inset 0 0 0 2px #07111d; }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(0,0,0,.72); color:#fff;
    text-align:center; padding:24px; z-index:20;
  }
  #overlay.hidden { display:none; }
  #overlay h2 { font-size:22px; }
  #overlay p { font-size:14px; opacity:.85; line-height:1.6; }
  #joy {
    position:fixed; left:22px; bottom:22px; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); z-index:15; display:none;
  }
  #joyStick {
    position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:rgba(255,255,255,.55);
  }
  body.mobile #joy { display:block; }
  #actionBtns { position:fixed; right:18px; bottom:22px; z-index:15; display:none;
      flex-direction:row; gap:14px; align-items:flex-end; }
  body.mobile #actionBtns { display:flex; }
  .actBtn {
    width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#fff; text-align:center; line-height:1.2;
    background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); position:relative;
    overflow:hidden;
  }
  .actBtn .chargeFill{ position:absolute; left:0; right:0; bottom:0; height:0%; background:rgba(255,214,64,.55); transition:height .05s linear; }
  .actBtn.cooling { opacity:.4; }
  .actBtn span{ position:relative; z-index:1; }
  #kickBtn { background:rgba(231,76,60,.22); }
  #tackleBtn { background:rgba(59,130,246,.22); }
</style>
</head>
<body>
<div id="wrap"><canvas id="gc"></canvas></div>
<div id="joy"><div id="joyStick"></div></div>
<div id="actionBtns">
  <div id="tackleBtn" class="actBtn"><span>돌진<br>태클</span></div>
  <div id="kickBtn" class="actBtn"><div class="chargeFill" id="kickChargeFill"></div><span>킥<br>(누르기)</span></div>
</div>
<div id="overlay"><h2 id="ovTitle">연결 대기 중...</h2><p id="ovText">잠시만 기다려주세요.</p></div>

<script>
'use strict';

/* ── 임베드/브릿지 (투게스터와 동일한 방식) ─────────────────────────────
 * room.js가 iframe을 열 때 항상 ?embed=1 을 URL에 심어준다. window.self
 * !== window.top 같은 런타임 판정은 일부 모바일 인앱브라우저/웹뷰에서
 * 신뢰할 수 없어서 쓰지 않는다 — 이 값이 어긋나면 아래 두 함수가 통째로
 * 아무 것도 보내지 않게 되어 "상대가 안 보이고 공도 안 움직이는" 증상으로
 * 이어진다.
 */
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || 'ontouchstart' in window;
if (IS_MOBILE) document.body.classList.add('mobile');

function bridgeSend(type, payload={}){
  if (!EMBED) return;
  // gameId 태그는 room.js가 일부 모바일 WebView의 source=null postMessage도
  // 현재 열려 있는 수학축구 iframe의 패킷으로 안전하게 식별하는 데 쓴다.
  try{ parent.postMessage({ type, gameId:'soccer', ...payload }, '*'); }catch(_){}
}

/* ── 멀티플레이 동기화 구조 / 2026-07 수정 이유 ────────────────────────
 * [기존 증상]
 * bridge_init의 players 명단은 정상 도착해서 양쪽 화면에 캐릭터는 모두
 * 만들어졌지만, 실제 이동은 축구 전용 sc_pos → sc_players 경로에만
 * 의존했다. 배포 환경에서 이 전용 위치 스냅샷이 되돌아오지 않자 각 iframe은
 * 자기 me 좌표만 갱신했고, 상대 캐릭터는 시작 위치에 멈춘 채 남았다.
 * 공 역시 별도 sc_ball 경로만 써서 같은 환경에서 화면끼리 공유되지 않았다.
 *
 * [현재 해결 방식]
 * 이 파일은 계속 sc_pos/sc_ball 형식으로 room.js에 상태를 보낸다. room.js가
 * 이를 다른 협동게임에서 실제 동작이 확인된 tg_state → tg_players 공용 집계
 * 경로에 __game:'soccer' 태그를 붙여 전달한다. 위치뿐 아니라 호스트의 공과
 * 골/스턴/종료 이벤트도 같은 스냅샷에 포함한다. 공용 경로가 일정 시간
 * 응답하지 않을 때만 기존 sc_* 경로를 자동 보조 경로로 사용한다.
 *
 * 두 경로의 좌표를 동시에 적용하면 오래된 스냅샷이 새 좌표를 덮어써서
 * 멈춤/튐이 재발할 수 있다. 따라서 room.js의 주 경로 선택과 __game 태그를
 * 제거하거나, sc_pos와 tg_state를 무조건 동시에 적용하지 말 것.
 */

/* ── 캔버스 / 필드 좌표계 (고정 논리좌표, CSS로만 스케일) ── */
const CW=900, CH=560;
const FX=40, FY=54, FW=820, FH=452;
const GOAL_W=14, GOAL_H=130;
const GOAL_Y1 = FY+FH/2-GOAL_H/2, GOAL_Y2 = FY+FH/2+GOAL_H/2;
const PR=17, BR=11;
const KICK_RANGE = PR+BR+16;   // 강슛이 닿는 사거리(접촉보다 살짝 넉넉하게)
const TACKLE_RANGE = PR*2+8;
const MAX_BALL_SPEED = 14;

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
function resize(){
  const wrap = document.getElementById('wrap');
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  const scale = Math.max(.01,Math.min((vw-6)/CW,(vh-6)/CH));
  // CSS로 900×560 캔버스를 크게 늘리기만 하면 도트 외곽과 필드 라인이
  // 뭉개진다. 내부 렌더 해상도는 항상 2배로 유지하고 논리 좌표계만 900×560을
  // 사용한다. 캐릭터 물리/네트워크 좌표는 그대로라 동기화에는 영향이 없다.
  const renderScale = 2;
  canvas.width = CW*renderScale; canvas.height = CH*renderScale;
  canvas.style.width = Math.max(1,Math.floor(CW*scale))+'px';
  canvas.style.height = Math.max(1,Math.floor(CH*scale))+'px';
  ctx.setTransform(renderScale,0,0,renderScale,0,0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize, { passive:true });
resize();

/* ── 아주 작은 자체 SFX (부모 window.SFX는 iframe이라 접근 불가라서 자체 구현) ── */
let sfxCtx = null;
function getSfxCtx(){
  if (sfxCtx) return sfxCtx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try{ sfxCtx = new Ctx(); }catch(_){ sfxCtx = null; }
  return sfxCtx;
}
function tone(freq, dur, delay, type, vol){
  const c = getSfxCtx(); if (!c) return;
  try{
    const t0 = c.currentTime + (delay||0);
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = type||'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.05, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(_){}
}
// 짧은 화이트노이즈를 밴드패스로 걸러 "퍽/쏴아" 하는 타격감/군중 질감을 낸다.
function noiseBurst(dur, delay, vol, bandFreq, Q, decayType){
  const c = getSfxCtx(); if (!c) return null;
  try{
    const t0 = c.currentTime + (delay||0);
    const bufLen = Math.max(1, Math.floor(c.sampleRate*dur));
    const buf = c.createBuffer(1, bufLen, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<bufLen;i++) data[i] = (Math.random()*2-1);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(bandFreq||900, t0); bp.Q.setValueAtTime(Q||1.2, t0);
    const gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.06, t0+0.01);
    if (decayType==='linear') gain.gain.linearRampToValueAtTime(0.0001, t0+dur);
    else gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(bp); bp.connect(gain); gain.connect(c.destination);
    src.start(t0); src.stop(t0+dur+0.02);
    return { src, gain };
  }catch(_){ return null; }
}
function sfxKick(power){
  tone(200+power*220, 0.09, 0, 'square', 0.05+power*0.03);
  noiseBurst(0.07, 0, 0.09+power*0.05, 1400+power*900, 2.2);
}
function sfxSwing(power){ tone(600+power*260, 0.05, 0, 'sine', 0.025+power*0.02); }
function sfxTackle(){
  tone(120, 0.12, 0, 'sawtooth', 0.05); tone(90, 0.1, 0.05, 'sawtooth', 0.04);
  noiseBurst(0.14, 0, 0.14, 350, 1.4);
}
function sfxGoal(){
  tone(660,0.12,0,'triangle',0.07); tone(880,0.14,0.09,'triangle',0.07); tone(1180,0.18,0.18,'triangle',0.07);
  sfxCheer();
}
function sfxCheer(){
  // 관중 함성: 대역이 서서히 열리는 노이즈 스웰
  noiseBurst(1.6, 0, 0.11, 1000, 0.7, 'linear');
  noiseBurst(1.9, 0.05, 0.09, 1800, 0.6, 'linear');
}
function sfxStun(){ tone(300,0.08,0,'sine',0.04); tone(220,0.08,0.06,'sine',0.03); }
function sfxTick(){ tone(880, 0.05, 0, 'square', 0.05); }
function sfxWhistle(long){
  const dur = long ? 0.55 : 0.22;
  tone(2400, dur, 0, 'sine', 0.06);
  tone(2380, dur, 0.02, 'sine', 0.04);
  if (long){ tone(2400, 0.3, dur+0.12, 'sine', 0.06); }
}
function primeSfx(){
  try{ const c=getSfxCtx(); if (c && c.state==='suspended') c.resume(); }catch(_){}
  startAmbientCrowd();
}

// 은은한 관중 웅성거림(경기 내내 배경에 낮게 깔림)
let ambientStarted = false;
function startAmbientCrowd(){
  if (ambientStarted) return;
  const c = getSfxCtx(); if (!c) return;
  ambientStarted = true;
  try{
    const bufLen = c.sampleRate*2;
    const buf = c.createBuffer(1, bufLen, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<bufLen;i++) data[i] = (Math.random()*2-1)*0.6;
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=500; bp.Q.value=0.6;
    const gain = c.createGain(); gain.gain.value = 0.018;
    src.connect(bp); bp.connect(gain); gain.connect(c.destination);
    src.start();
  }catch(_){}
}

/* ── 입력 ── */
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.code]=true; primeSfx();
  if (e.code === 'Space') beginKickCharge();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') tryTackle();
}, { passive:true });
window.addEventListener('keyup', e=>{
  keys[e.code]=false;
  if (e.code === 'Space') releaseKickCharge();
}, { passive:true });

let joyDX=0, joyDY=0, joyTouchId=null;
const joyEl = document.getElementById('joy'), joyStickEl = document.getElementById('joyStick');
function joyReset(){ joyDX=0; joyDY=0; joyStickEl.style.transform='translate(0,0)'; }
function joyHandle(t){
  const r = joyEl.getBoundingClientRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  let dx=(t.clientX-cx)/(r.width/2), dy=(t.clientY-cy)/(r.height/2);
  const len=Math.hypot(dx,dy);
  if(len>1){ dx/=len; dy/=len; }
  joyDX=dx; joyDY=dy;
  joyStickEl.style.transform = `translate(${dx*34}px, ${dy*34}px)`;
}
joyEl.addEventListener('touchstart', e=>{
  const t=e.changedTouches[0]; joyTouchId=t.identifier; joyHandle(t); e.preventDefault(); primeSfx();
}, { passive:false });
joyEl.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){ if(t.identifier===joyTouchId){ joyHandle(t); e.preventDefault(); } }
}, { passive:false });
window.addEventListener('touchend', e=>{
  for(const t of e.changedTouches){ if(t.identifier===joyTouchId){ joyTouchId=null; joyReset(); } }
}, { passive:true });
window.addEventListener('touchcancel', e=>{ joyTouchId=null; joyReset(); }, { passive:true });

// 모바일 킥/태클 버튼
const kickBtnEl = document.getElementById('kickBtn');
const tackleBtnEl = document.getElementById('tackleBtn');
const kickChargeFillEl = document.getElementById('kickChargeFill');
kickBtnEl.addEventListener('touchstart', e=>{ e.preventDefault(); primeSfx(); beginKickCharge(); }, { passive:false });
kickBtnEl.addEventListener('touchend',   e=>{ e.preventDefault(); releaseKickCharge(); }, { passive:false });
kickBtnEl.addEventListener('touchcancel',e=>{ e.preventDefault(); releaseKickCharge(); }, { passive:false });
tackleBtnEl.addEventListener('touchstart', e=>{ e.preventDefault(); primeSfx(); tryTackle(); }, { passive:false });

/* ── 게임 상태 ── */
let mySid='', myNick='Player', mySeat=-1, isHost=false, roster=[];
let players={};      // sid -> {x,y,netX,netY,netVX,netVY,netT, seat,team,nick,color,dir,kickAt,kickCharge,tackle,_lastKickAt}
let me=null;
let ball={x:FX+FW/2,y:FY+FH/2,vx:0,vy:0};
let netBall={x:FX+FW/2,y:FY+FH/2,vx:0,vy:0,netX:FX+FW/2,netY:FY+FH/2,netT:0};
let score={A:0,B:0};
let startTs=0, durationMs=120000;
let gameInitialized=false, gameActive=false, gameOver=false;
let lastPosSent=0, lastBallSent=0;
let stunUntilMap = {};       // sid -> 스턴 해제 시각(ms)
let particles = [];          // 골 세리머니/충격 파티클
let rings = [];               // 킥/태클 충격파 링 {x,y,r,alpha,color}
let ballTrail = [];           // 빠른 공 뒤에 남는 잔상
let shakeUntil = 0, shakeMag = 0;   // 화면 흔들림
let kickoffUntil = 0;         // 이 시각까지는 킥오프 카운트다운(입력/공 물리 정지)
let kickoffSoundsDone = new Set();
let scoreAnimA = 0, scoreAnimB = 0; // 골 넣었을 때 스코어보드 팝 애니메이션 타임스탬프
let prevScoreA = 0, prevScoreB = 0;
let lastImpactFxAt = '';      // 확정 킥 id별 이펙트 중복 방지

function addShake(mag, durMs){
  shakeMag = Math.max(shakeMag, mag);
  shakeUntil = Math.max(shakeUntil, Date.now()+durMs);
}
function spawnBurst(x, y, color, count, spread){
  for (let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = 1+Math.random()*(spread||3);
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, life:1, color, size:2.5+Math.random()*2.5 });
  }
}
function spawnRing(x, y, color){
  rings.push({ x, y, r:6, alpha:0.55, color });
}
function playKickImpact(x,y,power,dir){
  const p=clamp(power||.5,0,1);
  // v7에서 게스트에게 보이던 짧고 선명한 타격감 그대로 사용한다.
  spawnRing(x,y,'#ffd640');
  spawnBurst(x,y,'#ffffff',6,2.2);
  addShake(Math.min(7,(5+p*9)*.72),130);
  sfxKick(p);
}
function playKickImpactOnce(impactAt,x,y,power,dir){
  const id=String(impactAt||'');
  if(!id || id===lastImpactFxAt) return false;
  lastImpactFxAt=id;
  playKickImpact(x,y,power,dir);
  return true;
}

function updateKickoffCountdown(){
  if (kickoffUntil<=0) return;
  const left = kickoffUntil - Date.now();
  if (left<=0){
    if (!kickoffSoundsDone.has('go')){ kickoffSoundsDone.add('go'); sfxWhistle(false); }
    kickoffUntil = 0;
    return;
  }
  const sec = Math.ceil(left/1000);
  const key = 'tick'+sec;
  if (!kickoffSoundsDone.has(key) && sec<=3){ kickoffSoundsDone.add(key); sfxTick(); }
}

function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function teamOf(seat){ return (Number(seat)||0)%2===0 ? 'A' : 'B'; }
function colorOf(team){ return team==='A' ? '#e74c3c' : '#3b82f6'; }
function defaultDir(team){ return team==='A' ? 0 : Math.PI; } // A는 오른쪽(B골), B는 왼쪽(A골)을 바라봄

function getSpawn(seat){
  const team = teamOf(seat);
  const idx = Math.floor((Number(seat)||0)/2); // 같은 팀 내 순번
  const laneY = FY + FH*0.30 + idx*90;
  const x = team==='A' ? FX+FW*0.28 : FX+FW*0.72;
  return { x, y: clamp(laneY, FY+PR+4, FY+FH-PR-4) };
}

function makePlayer(seat, nick){
  const team = teamOf(seat);
  const sp = getSpawn(seat);
  return {
    x:sp.x, y:sp.y, vx:0, vy:0,
    netX:sp.x, netY:sp.y, netVX:0, netVY:0, netT:Date.now(),
    seat, team, nick: nick||'Player', color: colorOf(team),
    dir: defaultDir(team), kickAt:0, kickCharge:0, tackle:false, _lastKickAt:0,
  };
}

function startKickoffCountdown(ms){
  kickoffUntil = Date.now() + (ms||3000);
  kickoffSoundsDone = new Set();
}

function resetKickoff(){
  ball = { x:FX+FW/2, y:FY+FH/2, vx:0, vy:0 };
  netBall = { x:ball.x, y:ball.y, vx:0, vy:0, netX:ball.x, netY:ball.y, netT:Date.now() };
  ballTrail = [];
  lastBallSpeedSeen = 0;
  for(const p of Object.values(players)){
    const sp = getSpawn(p.seat);
    p.x=sp.x; p.y=sp.y; p.vx=0; p.vy=0;
    p.netX=sp.x; p.netY=sp.y; p.netVX=0; p.netVY=0; p.netT=Date.now();
  }
  startKickoffCountdown(2400);
}

function initGame(){
  if (!roster.length) return;
  players = {};
  for (const p of roster){
    players[p.sid] = makePlayer(p.seat, p.nick);
  }
  me = players[mySid] || null;
  score = { A:0, B:0 }; prevScoreA=0; prevScoreB=0;
  ball = { x:FX+FW/2, y:FY+FH/2, vx:0, vy:0 };
  netBall = { x:ball.x, y:ball.y, vx:0, vy:0, netX:ball.x, netY:ball.y, netT:Date.now() };
  gameOver = false;
  gameActive = true;
  hideOverlay();
  startKickoffCountdown(3000);
  startLoop();
}

/* 로스터(전원 명단)를 서버 권위값(this.sc_roster의 seat/isHost)과 항상 일치하도록
 * 맞춘다. 예전 버전은 새로 들어온 사람만 "추가"만 하고, 이미 있던 사람의
 * seat/team이 잘못됐거나(초기 roster 스냅샷이 아직 order 동기화 전이었던 경우
 * seat가 임시값으로 온 적이 있었다) 나간 사람이 필드에 유령처럼 남는 문제,
 * 그리고 방장이 중간에 나갔을 때 공 권위(isHost)가 아무에게도 넘어가지 않아
 * 공이 영원히 멈추는 문제가 있었다. sc_roster는 서버가 "지금 진짜로 방에
 * 있는 사람 + 정확한 좌석 + 정확한 방장"을 주는 유일한 소스이므로, 받을
 * 때마다 전체를 다시 맞춘다(좌표는 순간이동하지 않도록 보존).
 */
function applyRoster(list){
  roster = (list||[]).map(p=>({
    sid: String(p.sid||p.sessionId||''),
    nick: String(p.nick||'Player'),
    seat: Number(p.seat ?? -1),
    isHost: !!p.isHost,
  })).filter(p=>p.seat>=0 && p.sid);
  if (!roster.length) return;

  const knownSids = new Set(roster.map(r=>r.sid));

  // 1) 로스터에 더 이상 없는 유령 플레이어 제거(중간 퇴장자가 필드에 얼어붙어
  //    남아있던 문제의 원인).
  for (const sid of Object.keys(players)){
    if (!knownSids.has(sid)) delete players[sid];
  }

  // 2) 신규/기존 플레이어를 좌석·팀·닉네임 기준으로 동기화(좌표는 유지).
  for (const r of roster){
    let p = players[r.sid];
    if (!p){
      p = players[r.sid] = makePlayer(r.seat, r.nick);
    } else {
      if (p.seat !== r.seat){
        p.seat = r.seat;
        p.team = teamOf(r.seat);
        p.color = colorOf(p.team);
        p.dir = defaultDir(p.team);
      }
      p.nick = r.nick;
    }
    if (r.sid === mySid){
      isHost = r.isHost; // 방장이 바뀌어도(중간 퇴장 등) 항상 최신값으로 갱신 → 공 권위가 끊기지 않음
    }
  }

  if (!me) me = players[mySid] || null;

  // bridge_init가 첫 room_state보다 먼저 와 빈 로스터로 초기화된 경우에도,
  // 뒤이어 도착한 서버 로스터만으로 게임을 정상 시작한다.
  if (gameInitialized && !gameActive && !gameOver && me){
    initGame();
  }
}

function applyRemotePlayers(map){
  if (!map) return;
  const now = Date.now();
  for (const [sid, snap] of Object.entries(map)){
    if (sid === mySid) continue;
    let p = players[sid];
    if (!p){
      const seat = Number(snap.seat ?? -1);
      if (seat < 0) continue;
      p = players[sid] = makePlayer(seat, snap.nick);
    }
    p.netX = Number(snap.x ?? p.netX);
    p.netY = Number(snap.y ?? p.netY);
    p.netVX = Number(snap.vx ?? 0);
    p.netVY = Number(snap.vy ?? 0);
    p.netT = now;
    if (snap.dir != null) p.dir = Number(snap.dir);
    const incomingKickAt=Number(snap.kickAt||0);
    if(incomingKickAt && incomingKickAt!==p.kickAt) p._kickPoseUntil=now+180;
    p.kickAt = Number(snap.kickAt ?? p.kickAt ?? 0);
    p.kickCharge = Number(snap.kickCharge ?? p.kickCharge ?? 0);
    if(snap.kickX!=null) p.kickX=Number(snap.kickX);
    if(snap.kickY!=null) p.kickY=Number(snap.kickY);
    if(snap.kickDir!=null) p.kickDir=Number(snap.kickDir);
    if(snap.kickBallX!=null) p.kickBallX=Number(snap.kickBallX);
    if(snap.kickBallY!=null) p.kickBallY=Number(snap.kickBallY);
    p.tackle = !!snap.tackle;
  }
}

function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); }
function showOverlay(title, text){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').textContent = text || '';
  document.getElementById('overlay').classList.remove('hidden');
}

/* ── 킥 차징 / 태클 ── */
let kickCharging = false, kickChargeStart = 0;
let pendingKickAt = 0, pendingKickCharge = 0, pendingKickUntil = 0;
let pendingKickX=0, pendingKickY=0, pendingKickDir=0, pendingKickBallX=0, pendingKickBallY=0;
let tackleCooldownUntil = 0;
let tackleActiveUntil = 0;
const KICK_CHARGE_MS = 600;
const TACKLE_COOLDOWN_MS = 900;
const TACKLE_DUR_MS = 220;
const STUN_MS = 550;

function isStunned(sid, now){ return (stunUntilMap[sid]||0) > (now||Date.now()); }

function beginKickCharge(){
  if (!me || !gameActive || gameOver) return;
  if (isStunned(mySid)) return;
  if (kickCharging) return;
  kickCharging = true;
  kickChargeStart = Date.now();
}
function releaseKickCharge(){
  if (!kickCharging) return;
  kickCharging = false;
  if (!me || !gameActive || gameOver) return;
  const held = Date.now() - kickChargeStart;
  const charge = clamp(held / KICK_CHARGE_MS, 0, 1);
  pendingKickAt = Date.now();
  pendingKickCharge = 0.3 + 0.7*charge; // 탭만 해도 최소한의 슛은 나가도록
  // Worker의 tg_state 전송 제한(약 40ms)과 위치 송신 주기(약 30ms)가 엇갈려
  // 한 프레임짜리 킥이 버려질 수 있으므로 같은 edge id를 잠깐 반복 전송한다.
  pendingKickUntil = pendingKickAt+240;
  const kickBall=ball_or_netball();
  pendingKickX=me.x; pendingKickY=me.y; pendingKickDir=me.dir;
  pendingKickBallX=kickBall.x; pendingKickBallY=kickBall.y;
  // 내 상태는 applyRemotePlayers()에서 의도적으로 제외된다. 이전에는 이 값을
  // 네트워크에만 보내서, 게스트의 킥은 호스트가 받아 처리했지만 호스트 자신의
  // 킥은 호스트 players[mySid]에 기록되지 않았다. 그 결과 호스트는 충전 슛이
  // 발동하지 않고 몸 충돌로 공을 미는 것처럼만 보였다. 로컬 객체에도 동일한
  // edge 값을 먼저 기록해 양쪽 모두 같은 호스트 권위 판정을 타게 한다.
  me.kickAt = pendingKickAt;
  me.kickCharge = pendingKickCharge;
  me.kickX=pendingKickX; me.kickY=pendingKickY; me.kickDir=pendingKickDir;
  me.kickBallX=pendingKickBallX; me.kickBallY=pendingKickBallY;
  me._kickPoseUntil = Date.now()+180;
  sfxSwing(pendingKickCharge); // 호스트 여부와 상관없이 내가 찬 순간 즉시 피드백
  // 게스트는 호스트 왕복을 기다리면 충격 효과가 늦거나 보간에 나뉘어 약해진다.
  // 공이 실제 사거리 안일 때만 화면 효과를 먼저 재생하고, 공의 위치/속도 판정은
  // 여전히 호스트가 맡는다. 호스트는 updateBallHost()의 확정 판정에서 재생한다.
  if(!isHost){
    const b=ball_or_netball();
    // 보간 중인 화면 좌표뿐 아니라 방금 받은 권위 목표 좌표도 확인한다.
    // 빠른 공은 화면 표시가 목표보다 몇 프레임 뒤라 실제로 맞은 슛을 놓칠 수 있다.
    const visibleDist=Math.hypot(b.x-me.x,b.y-me.y);
    const targetDist=Math.hypot((netBall.netX??b.x)-me.x,(netBall.netY??b.y)-me.y);
    if(Math.min(visibleDist,targetDist)<KICK_RANGE+3){
      playKickImpactOnce(pendingKickAt,b.x,b.y,pendingKickCharge,me.dir);
      lastBallSpeedSeen=Math.max(lastBallSpeedSeen,5+pendingKickCharge*7);
    }
  }
}
function tryTackle(){
  if (!me || !gameActive || gameOver) return;
  if (isStunned(mySid)) return;
  const now = Date.now();
  if (now < tackleCooldownUntil) return;
  tackleActiveUntil = now + TACKLE_DUR_MS;
  tackleCooldownUntil = now + TACKLE_COOLDOWN_MS;
}

/* ── 매 프레임 갱신 ── */
function updateMe(){
  if (!me || !gameActive || gameOver) return;
  const now = Date.now();
  if (now < kickoffUntil){ me.vx=0; me.vy=0; me.tackle=false; return; }
  if (isStunned(mySid, now)){ me.vx=0; me.vy=0; me.tackle=false; return; }

  let dx=0, dy=0;
  if (keys['ArrowLeft']||keys['KeyA']) dx-=1;
  if (keys['ArrowRight']||keys['KeyD']) dx+=1;
  if (keys['ArrowUp']||keys['KeyW']) dy-=1;
  if (keys['ArrowDown']||keys['KeyS']) dy+=1;
  if (IS_MOBILE && (Math.abs(joyDX)>0.12 || Math.abs(joyDY)>0.12)){ dx=joyDX; dy=joyDY; }
  const rawLen = Math.hypot(dx,dy);
  const len = rawLen;
  if (len>0){ dx/=len; dy/=len; me.dir = Math.atan2(dy,dx); }

  const tackling = now < tackleActiveUntil;
  const sprinting = !kickCharging && !tackling && ((keys['KeyE']) || (IS_MOBILE && rawLen>.88));
  const SPD = tackling ? 6.4 : (sprinting ? 4.8 : (kickCharging ? 2.45 : 3.75));
  const targetVX=dx*SPD, targetVY=dy*SPD;
  // 즉시 최고속도로 바뀌던 이동을 가속/감속 방식으로 바꿔 출발, 방향 전환,
  // 급정지가 구분된다. 차징 중에는 속도가 낮아져 슛 타이밍에도 선택이 생긴다.
  const accel = tackling ? .58 : (len>0 ? .34 : .24);
  me.vx = lerp(me.vx||0,targetVX,accel);
  me.vy = lerp(me.vy||0,targetVY,accel);
  if (len===0 && Math.hypot(me.vx,me.vy)<.08){ me.vx=0; me.vy=0; }
  if (tackling && len===0){
    // 방향 입력이 없어도 바라보는 방향으로 돌진
    me.vx = Math.cos(me.dir)*SPD; me.vy = Math.sin(me.dir)*SPD;
  }
  me.x = clamp(me.x+me.vx, FX+PR, FX+FW-PR);
  me.y = clamp(me.y+me.vy, FY+PR, FY+FH-PR);

  // 선수끼리 완전히 겹쳐 통과하지 않도록 로컬 선수를 가장 가까운 경계로
  // 밀어낸다. 판정은 좌표만 보정하므로 서버 구조 변경 없이도 수비가 가능하다.
  for(const [sid,q] of Object.entries(players)){
    if(sid===mySid) continue;
    const ox=me.x-q.x, oy=me.y-q.y, od=Math.hypot(ox,oy)||.001, min=PR*1.72;
    if(od<min){
      const nx=ox/od, ny=oy/od, push=(min-od)*.55;
      me.x=clamp(me.x+nx*push,FX+PR,FX+FW-PR);
      me.y=clamp(me.y+ny*push,FY+PR,FY+FH-PR);
      const into=me.vx*nx+me.vy*ny;
      if(into<0){ me.vx-=nx*into*.72; me.vy-=ny*into*.72; }
    }
  }
  me.tackle = tackling;

  // 킥 차지 UI(모바일 버튼 게이지)
  if (kickCharging){
    const pct = clamp((now-kickChargeStart)/KICK_CHARGE_MS, 0, 1)*100;
    kickChargeFillEl.style.height = pct+'%';
  } else {
    kickChargeFillEl.style.height = '0%';
  }
  tackleBtnEl.classList.toggle('cooling', now < tackleCooldownUntil);
}

/* 원격 플레이어 보간: 마지막 스냅샷 시각(netT)로부터 경과한 시간만큼 속도로
 * 짧게 외삽(extrapolate)한 뒤 그 목표점으로 부드럽게 당긴다. 예전 버전은
 * "마지막으로 받은 좌표"로 곧장 당기기만 해서 20Hz 스냅샷 사이에 살짝
 * 끊겨 보였는데, 이렇게 하면 패킷 사이에도 자연스럽게 이어져 보인다. */
function smoothToward(cur, netX, netY, netVX, netVY, netT, now, factor){
  const dt = clamp(now-(netT||now), 0, 160); // 과도한 외삽 방지
  const tx = netX + (netVX||0)*dt*0.06;
  const ty = netY + (netVY||0)*dt*0.06;
  return { x: lerp(cur.x, clamp(tx, FX+PR, FX+FW-PR), factor),
           y: lerp(cur.y, clamp(ty, FY+PR, FY+FH-PR), factor) };
}

function lerpRemote(){
  const now = Date.now();
  for (const [sid,p] of Object.entries(players)){
    if (sid===mySid) continue;
    const nxt = smoothToward(p, p.netX, p.netY, p.netVX, p.netVY, p.netT, now, 0.35);
    p.x = nxt.x; p.y = nxt.y;
  }
}

function updateNetBall(){
  if (isHost) return; // 호스트는 자기 물리 계산 결과(ball)를 그대로 그린다
  const now = Date.now();
  const localSpeed=me?Math.hypot(me.vx||0,me.vy||0):0;
  const authDist=me?Math.hypot(netBall.netX-me.x,netBall.netY-me.y):Infinity;
  const viewDist=me?Math.hypot(netBall.x-me.x,netBall.y-me.y):Infinity;
  const localDribbling=!!(me&&gameActive&&now>=kickoffUntil&&localSpeed>.12&&Math.min(authDist,viewDist)<PR+BR+12);

  // 로컬 드리블 중 매 프레임 '지연된 서버 공 → 내 발 앞'을 왕복 보간하면
  // 공이 발에 비벼지며 뒤로 튀는 모습이 생긴다. 드리블 중에는 서버 좌표를
  // 약하게만 반영하고 발 앞 목표를 우선한다. 드리블이 끝나면 즉시 일반 권위
  // 보간으로 돌아가므로 득점/충돌의 최종 결정권은 계속 호스트에게 있다.
  const nxt = smoothToward(netBall, netBall.netX, netBall.netY, netBall.vx, netBall.vy, netBall.netT, now, localDribbling?0.52:0.74);
  netBall.x = nxt.x; netBall.y = nxt.y;

  // 게스트 로컬 드리블 예측: 호스트의 다음 공 스냅샷을 기다리는 동안에도
  // 내 발 앞의 공만 같은 접촉 공식으로 짧게 움직인다. 득점/최종 물리는 여전히
  // 호스트가 결정하고, 새 권위 스냅샷이 오면 위 보간이 자연스럽게 복귀시킨다.
  if(localDribbling){
    const mdx=netBall.x-me.x,mdy=netBall.y-me.y,md=Math.hypot(mdx,mdy)||.001;
    const tdx=netBall.netX-me.x,tdy=netBall.netY-me.y,td=Math.hypot(tdx,tdy)||.001;
    const speed=Math.hypot(me.vx||0,me.vy||0);
    if(Math.min(md,td)<PR+BR+12 && speed>.12){
      // 드리블 중에는 지연된 화면 공의 방향이 아니라 실제 이동 방향의 발 앞을
      // 목표로 잡는다. 그렇지 않으면 왼쪽으로 달리는데 과거 공이 오른쪽에 남아
      // 반대쪽으로 미는 현상이 생긴다.
      const nx=Math.cos(me.dir),ny=Math.sin(me.dir);
      const tx=me.x+nx*(PR+BR),ty=me.y+ny*(PR+BR);
      netBall.x=lerp(netBall.x,tx,.54); netBall.y=lerp(netBall.y,ty,.54);
      netBall.vx=lerp(netBall.vx,(me.vx||0)*.92+nx*Math.min(4.8,.45+speed*.82),.34);
      netBall.vy=lerp(netBall.vy,(me.vy||0)*.92+ny*Math.min(4.8,.45+speed*.82),.34);
    }
  }
}

/* 공은 호스트만 물리 계산을 하고(권위), 나머지는 sc_ball 수신값을 그대로
   보간 표시만 한다 — 투게스터가 박스/퍼즐 상태를 다루는 방식과 동일한
   "한쪽만 계산, 나머지는 받아서 보간" 패턴.
   isHost는 이제 sc_roster를 받을 때마다 최신값으로 갱신되므로(applyRoster),
   방장이 중간에 나가도 새 방장 클라이언트가 자동으로 공 계산을 이어받는다. */
function updateBallHost(){
  if (!isHost || !gameActive || gameOver) return;
  const now = Date.now();
  if (now < kickoffUntil) return;

  for (const [sid,p] of Object.entries(players)){
    // 원격 선수는 화면에 그리는 보간 좌표보다 최신 net 좌표와 속도 외삽을
    // 사용한다. 이 차이가 호스트/게스트 드리블 반응 차이의 핵심 원인이었다.
    const age=clamp(now-(p.netT||now),0,120);
    // 원격 선수의 p.vx/p.vy는 화면 보간용 객체에 갱신되지 않는다. 이전에는
    // 여기서 그 값을 사용해 게스트가 실제로 달려도 호스트 물리에는 정지한
    // 선수처럼 보였다. 반드시 수신한 netVX/netVY를 물리에 사용한다.
    const effectiveVX=sid===mySid?(p.vx||0):(p.netVX||0);
    const effectiveVY=sid===mySid?(p.vy||0):(p.netVY||0);
    const remoteSpeed=Math.hypot(effectiveVX,effectiveVY);
    // v12의 고정 2~4프레임 선행값은 잘못된 p.vx를 가리기 위한 임시 보정이었다.
    // 이제 실제 netVX를 쓰므로 고정 선행을 더하면 게스트 공만 과하게 나간다.
    // 수신 뒤 경과한 시간만 최대 1프레임 보상해 호스트와 같은 이동량을 유지한다.
    const lead=clamp(age*.02,0,1);
    const controlX=sid===mySid?p.x:clamp((p.netX??p.x)+(p.netVX||0)*lead,FX+PR,FX+FW-PR);
    const controlY=sid===mySid?p.y:clamp((p.netY??p.y)+(p.netVY||0)*lead,FY+PR,FY+FH-PR);
    const dx = ball.x-controlX, dy = ball.y-controlY;
    const d = Math.hypot(dx,dy) || 0.0001;
    const minD = PR+BR;

    // 가까이 붙었을 때는 매 프레임 힘을 더하는 핀볼식 밀기가 아니라 선수 속도에
    // 공을 서서히 맞춘다. 그래서 천천히 움직이면 드리블, 충전 킥이면 아래의 슛이 된다.
    if (d < minD){
      const moving=remoteSpeed>.12;
      // 이동 중에는 지연된 공의 상대 위치가 아니라 선수의 실제 진행 방향을
      // 드리블 방향으로 사용한다. 보정된 선수 좌표가 공을 추월하더라도 nx가
      // 반대로 뒤집히지 않으므로 공이 갑자기 발뒤꿈치 쪽으로 빠지지 않는다.
      const nx=moving?effectiveVX/remoteSpeed:dx/d;
      const ny=moving?effectiveVY/remoteSpeed:dy/d;
      const footX=controlX+nx*minD, footY=controlY+ny*minD;
      ball.x=lerp(ball.x,footX,moving ? .72 : 1);
      ball.y=lerp(ball.y,footY,moving ? .72 : 1);
      const carry=Math.min(4.8,.45+remoteSpeed*.82);
      const targetVX=effectiveVX*.92+nx*carry;
      const targetVY=effectiveVY*.92+ny*carry;
      ball.vx=lerp(ball.vx,targetVX,moving ? .34 : .23);
      ball.vy=lerp(ball.vy,targetVY,moving ? .34 : .23);
    }

    // 충전 슛: kickAt이 마지막으로 처리한 값과 다르면 "새 킥"으로 인식(간헐적
    // 위치 패킷에 덮여 한 프레임짜리 이벤트가 사라지지 않도록 sticky 필드로 옴).
    if (p.kickAt && p.kickAt !== p._lastKickAt){
      p._lastKickAt = p.kickAt;
      const kickPX=Number.isFinite(p.kickX)?p.kickX:p.x;
      const kickPY=Number.isFinite(p.kickY)?p.kickY:p.y;
      const requestBallDist=Math.hypot(Number(p.kickBallX)-kickPX,Number(p.kickBallY)-kickPY);
      const reportedBallDrift=Math.hypot(ball.x-Number(p.kickBallX),ball.y-Number(p.kickBallY));
      // 게스트가 찬 순간에는 공 옆이었어도 왕복 지연 뒤 호스트 좌표는 벌어질
      // 수 있다. 현재 거리 또는 킥 순간 보고 좌표가 타당하면 슛을 인정한다.
      const kickInRange=d<KICK_RANGE+10 ||
        (Number.isFinite(requestBallDist) && requestBallDist<KICK_RANGE+7 && reportedBallDrift<64);
      if (kickInRange){
        const dir = Number.isFinite(p.kickDir) ? p.kickDir : (Number.isFinite(p.dir) ? p.dir : Math.atan2(dy,dx));
        const charge=clamp(p.kickCharge||0,0,1);
        // v7과 같은 파워 곡선/가산 방식으로 복원한다.
        const power = 5 + charge*9;
        ball.vx+=Math.cos(dir)*power;
        ball.vy+=Math.sin(dir)*power;
        // 속도 변화로 이펙트를 추측하면 보간/프레임 속도에 따라 양쪽에서
        // 사라질 수 있다. 호스트가 확정한 킥 id를 공 스냅샷에 실어 전원이
        // 정확히 한 번씩 같은 이펙트를 재생하게 한다.
        ball.impactAt=String(p.kickAt||now);
        ball.impactPower=charge;
        ball.impactDir=dir;
        p._kickPoseUntil=now+180;
        playKickImpactOnce(ball.impactAt,ball.x,ball.y,charge,dir);
        // 같은 프레임의 속도 변화 감지기가 이 효과를 한 번 더 재생하지 않게 기준 갱신.
        lastBallSpeedSeen=Math.hypot(ball.vx,ball.vy);
      }
    }

    // 돌진 태클: 상대 팀 선수와 부딪히면 스턴시키고 공을 살짝 튕겨낸다.
    // 서버는 sc_stun을 seat 0(호스트)만 보낼 수 있게 막아뒀으므로, 태클
    // "판정" 자체는 반드시 호스트 쪽에서 해야 한다 — 그래서 각 클라이언트는
    // 의사만(sc_pos.tackle) 보내고, 실제 스턴 발생은 여기 호스트 루프에서만.
    if (p.tackle){
      for (const q of Object.values(players)){
        if (q === p || q.team === p.team) continue;
        if (isStunned(playerSidOf(q), now)) continue;
        const qd = Math.hypot(q.x-p.x, q.y-p.y);
        if (qd < TACKLE_RANGE){
          const qsid = playerSidOf(q);
          const key = qsid;
          if ((p._tackleHitAt && p._tackleHitAt[key] && now - p._tackleHitAt[key] < 700)) continue;
          p._tackleHitAt = p._tackleHitAt || {};
          p._tackleHitAt[key] = now;
          applyStun(qsid, STUN_MS, /*local broadcast now, plus tell server*/true);
          // 태클한 방향으로 공도 살짝 튕겨나가도록(뺏는 느낌)
          const bd = Math.hypot(ball.x-q.x, ball.y-q.y);
          if (bd < KICK_RANGE){
            ball.vx += Math.cos(p.dir)*3.5;
            ball.vy += Math.sin(p.dir)*3.5;
          }
        }
      }
    }
  }

  ball.x += ball.vx; ball.y += ball.vy;
  ball.vx *= 0.985; ball.vy *= 0.985;
  const bs = Math.hypot(ball.vx, ball.vy);
  if (bs > MAX_BALL_SPEED){ ball.vx *= MAX_BALL_SPEED/bs; ball.vy *= MAX_BALL_SPEED/bs; }

  if (ball.y-BR < FY){ ball.y = FY+BR; ball.vy = Math.abs(ball.vy)*0.6; }
  if (ball.y+BR > FY+FH){ ball.y = FY+FH-BR; ball.vy = -Math.abs(ball.vy)*0.6; }

  if (ball.x-BR < FX){
    if (ball.y > GOAL_Y1 && ball.y < GOAL_Y2) scoreGoal('B');
    else { ball.x = FX+BR; ball.vx = Math.abs(ball.vx)*0.6; }
  }
  if (ball.x+BR > FX+FW){
    if (ball.y > GOAL_Y1 && ball.y < GOAL_Y2) scoreGoal('A');
    else { ball.x = FX+FW-BR; ball.vx = -Math.abs(ball.vx)*0.6; }
  }
}

let lastBallSpeedSeen = 0;
function updateBallImpactFx(){
  const b = ball_or_netball();
  const spd = Math.hypot(b.vx||0, b.vy||0);
  const jump = spd - lastBallSpeedSeen;
  if (jump > 3.2){
    const dir=Math.atan2(b.vy||0,b.vx||0);
    playKickImpact(b.x,b.y,clamp(jump/9,0,1),dir);
  }
  lastBallSpeedSeen = spd;
}
function updateBallTrail(){
  const b = ball_or_netball();
  const spd = Math.hypot(b.vx||0, b.vy||0);
  if (spd > 3){
    ballTrail.push({ x:b.x, y:b.y, life:1 });
    if (ballTrail.length > 14) ballTrail.shift();
  }
  for (const t of ballTrail) t.life -= 0.09;
  ballTrail = ballTrail.filter(t=>t.life>0);
}
function updateRings(){
  for (const r of rings){ r.r += 2.4; r.alpha -= 0.045; }
  rings = rings.filter(r=>r.alpha>0);
}

function playerSidOf(p){
  for (const [sid, v] of Object.entries(players)) if (v === p) return sid;
  return null;
}

let stunFxThrottle = {};
function applyStun(sid, dur, notifyServer){
  stunUntilMap[sid] = Date.now()+dur;
  const now = Date.now();
  if (!stunFxThrottle[sid] || now - stunFxThrottle[sid] > 300){
    stunFxThrottle[sid] = now;
    const p = players[sid];
    if (p){ spawnBurst(p.x, p.y, '#ffe08a', 10, 3); spawnRing(p.x, p.y, '#ffffff'); }
    if (sid === mySid){ sfxStun(); addShake(5, 200); }
    else { sfxTackle(); }
  }
  if (notifyServer){
    bridgeSend('sc_stun', { sid, dur });
  }
}

let goalPending = false;
function scoreGoal(team){
  if (goalPending) return;
  goalPending = true;
  if (team==='A') score.A++; else score.B++;
  if (team==='A') scoreAnimA = Date.now(); else scoreAnimB = Date.now();
  bridgeSend('sc_goal', { team, scoreA:score.A, scoreB:score.B });
  showGoalFlash(team);
  spawnGoalParticles(team);
  sfxGoal();
  addShake(8, 400);
  setTimeout(()=>{ resetKickoff(); goalPending=false; }, 900);
}

let goalFlashUntil=0, goalFlashTeam=null;
function showGoalFlash(team){ goalFlashTeam=team; goalFlashUntil=Date.now()+900; }
function spawnGoalParticles(team){
  const cx = team==='A' ? FX+FW : FX;
  const cy = (GOAL_Y1+GOAL_Y2)/2;
  const cols = team==='A' ? ['#e74c3c','#ff8a80','#fff'] : ['#3b82f6','#8ab4ff','#fff'];
  for (let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4;
    particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2,
      life:1, color: cols[i%cols.length], size:3+Math.random()*3 });
  }
}
function updateParticles(){
  for (const pt of particles){
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life -= 0.018;
  }
  particles = particles.filter(pt=>pt.life>0);
}

/* ── 네트워크 송신 ── */
function netSends(){
  if (!EMBED || !gameActive) return;
  const now = Date.now();
  if (me && now-lastPosSent >= 30){
    lastPosSent = now;
    const kickActive=now<pendingKickUntil;
    const kickAt = kickActive ? pendingKickAt : 0;
    const kickCharge = kickActive ? pendingKickCharge : 0;
    if(!kickActive && me.kickAt){ me.kickAt=0; me.kickCharge=0; }
    bridgeSend('sc_pos', {
      x:me.x, y:me.y, vx:me.vx, vy:me.vy, dir:me.dir,
      kickAt, kickCharge, tackle:!!me.tackle,
      kickX:pendingKickX, kickY:pendingKickY, kickDir:pendingKickDir,
      kickBallX:pendingKickBallX, kickBallY:pendingKickBallY,
    });
  }
  if (isHost && now-lastBallSent >= 30){
    lastBallSent = now;
    bridgeSend('sc_ball', {
      x:ball.x, y:ball.y, vx:ball.vx, vy:ball.vy, owner:null,
      impactAt:ball.impactAt||'', impactPower:ball.impactPower||0, impactDir:ball.impactDir||0
    });
  }
}

/* ── 타이머 ── */
let overSent = false;
function checkTimer(){
  if (!gameActive || gameOver || startTs<=0) return;
  const left = durationMs - (Date.now()-startTs);
  if (left <= 0 && isHost && !overSent){
    overSent = true;
    const winner = score.A===score.B ? 'draw' : (score.A>score.B ? 'A' : 'B');
    bridgeSend('sc_over', { winner, scoreA:score.A, scoreB:score.B });
  }
}

/* ── 렌더링 ── */
let crowdCanvas = null;
function buildCrowdCanvas(){
  const c = document.createElement('canvas');
  c.width = CW; c.height = CH;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  // 경기장 바깥: 투게스터처럼 굵은 외곽선과 명확한 명암 단계로 구성한다.
  g.fillStyle = '#07111d'; g.fillRect(0,0,CW,CH);
  g.fillStyle = '#101c31'; g.fillRect(0,0,CW,FY); g.fillRect(0,FY+FH,CW,CH-(FY+FH));
  g.fillStyle = '#192943'; g.fillRect(0,FY-15,CW,11); g.fillRect(0,FY+FH+4,CW,12);
  g.fillStyle = '#263a58'; g.fillRect(0,FY-8,CW,4); g.fillRect(0,FY+FH+4,CW,4);

  // 관중석 픽셀: 완전 무작위 점 대신 줄을 맞춰 도트게임 배경처럼 읽히게 한다.
  const crowdCols = ['#ff7b7b','#66d9c8','#ffd166','#8eb6ff','#c990ff','#f2f5ff'];
  for (const y of [10,22,34,FY+FH+16,FY+FH+28,FY+FH+40]){
    for (let x=10; x<CW-10; x+=8){
      const idx = Math.abs(((x/8)|0)+((y/6)|0)*3) % crowdCols.length;
      g.fillStyle = crowdCols[idx];
      g.fillRect(x, y, 4, 4);
      if (((x/8+y)|0)%3!==0){ g.fillStyle='#0b1628'; g.fillRect(x+4,y+1,2,3); }
    }
  }

  // 사이드 보드/팀 배너
  g.fillStyle='#12243a'; g.fillRect(0,FY,FX-5,FH); g.fillRect(FX+FW+5,FY,CW-(FX+FW+5),FH);
  for (let y=FY+18, i=0; y<FY+FH-18; y+=54,i++){
    g.fillStyle = i%2 ? '#25578d' : '#8b3046';
    g.fillRect(5,y,29,32); g.fillRect(CW-34,y,29,32);
    g.fillStyle='rgba(255,255,255,.78)';
    g.fillRect(10,y+7,19,3); g.fillRect(10,y+14,13,3); g.fillRect(10,y+21,19,3);
    g.fillRect(CW-29,y+7,19,3); g.fillRect(CW-23,y+14,13,3); g.fillRect(CW-29,y+21,19,3);
  }

  // 잔디: 넓은 세로 커팅 + 고정 픽셀 결. 매 프레임 랜덤 생성하지 않는다.
  g.fillStyle='#23884b'; g.fillRect(FX,FY,FW,FH);
  const stripeW = FW/10;
  for (let i=0;i<10;i++){
    g.fillStyle = i%2 ? '#2a9a55' : '#248b4c';
    g.fillRect(Math.round(FX+i*stripeW),FY,Math.ceil(stripeW)+1,FH);
  }
  for (let y=FY+10;y<FY+FH-6;y+=18){
    for (let x=FX+8;x<FX+FW-6;x+=24){
      const phase = ((x+y)/6|0)%3;
      g.fillStyle = phase===0 ? 'rgba(255,255,255,.045)' : 'rgba(5,57,29,.08)';
      g.fillRect(x+(phase*3),y,6,2);
    }
  }

  // 필드 바깥 두꺼운 픽셀 테두리/깊이
  g.fillStyle='#0b4328'; g.fillRect(FX-6,FY-6,FW+12,6); g.fillRect(FX-6,FY+FH,FW+12,6);
  g.fillRect(FX-6,FY,6,FH); g.fillRect(FX+FW,FY,6,FH);
  return c;
}

function drawField(){
  if (!crowdCanvas) crowdCanvas = buildCrowdCanvas();
  ctx.drawImage(crowdCanvas, 0, 0);

  // 라인은 밝은 본선+어두운 1px 그림자를 겹쳐 작은 화면에서도 또렷하게 보인다.
  ctx.strokeStyle='rgba(7,55,31,.45)'; ctx.lineWidth=6;
  ctx.strokeRect(FX,FY,FW,FH);
  ctx.beginPath(); ctx.moveTo(FX+FW/2+1,FY); ctx.lineTo(FX+FW/2+1,FY+FH); ctx.stroke();
  ctx.strokeStyle = '#eaffef'; ctx.lineWidth = 3;
  ctx.strokeRect(FX,FY,FW,FH);
  ctx.beginPath(); ctx.moveTo(FX+FW/2,FY); ctx.lineTo(FX+FW/2,FY+FH); ctx.stroke();
  ctx.beginPath(); ctx.arc(FX+FW/2, FY+FH/2, 55, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle='#eaffef'; ctx.fillRect(FX+FW/2-3, FY+FH/2-3, 6, 6);

  // 수학축구 테마의 낮은 대비 워터마크(경기 판독을 방해하지 않게 아주 옅게)
  ctx.save(); ctx.globalAlpha=.10; ctx.fillStyle='#eaffef'; ctx.font='bold 25px monospace'; ctx.textAlign='center';
  ctx.fillText('+',FX+FW*.25,FY+FH*.25); ctx.fillText('×',FX+FW*.75,FY+FH*.25);
  ctx.fillText('÷',FX+FW*.25,FY+FH*.78); ctx.fillText('=',FX+FW*.75,FY+FH*.78); ctx.restore();

  // 코너 아크 + 페널티 박스(각진 픽셀 느낌으로 두껍게)
  ctx.lineWidth = 3; ctx.strokeStyle = '#dfe8df';
  const cornerR = 14;
  [[FX,FY,0,Math.PI/2],[FX+FW,FY,Math.PI/2,Math.PI],[FX,FY+FH,-Math.PI/2,0],[FX+FW,FY+FH,Math.PI,Math.PI*1.5]]
    .forEach(([cx,cy,s,e])=>{ ctx.beginPath(); ctx.arc(cx,cy,cornerR,s,e); ctx.stroke(); });
  const boxW=88, boxH=218, boxY=FY+FH/2-boxH/2;
  ctx.strokeRect(FX, boxY, boxW, boxH);
  ctx.strokeRect(FX+FW-boxW, boxY, boxW, boxH);
  const goalBoxW=34, goalBoxH=120, goalBoxY=FY+FH/2-goalBoxH/2;
  ctx.strokeRect(FX,goalBoxY,goalBoxW,goalBoxH);
  ctx.strokeRect(FX+FW-goalBoxW,goalBoxY,goalBoxW,goalBoxH);
  ctx.fillStyle='#eaffef';
  ctx.fillRect(FX+62,FY+FH/2-2,4,4); ctx.fillRect(FX+FW-66,FY+FH/2-2,4,4);

  // 코너 플래그
  for (const [cx,cy,sy] of [[FX,FY,1],[FX+FW,FY,1],[FX,FY+FH,-1],[FX+FW,FY+FH,-1]]){
    ctx.fillStyle='#f8e36a'; ctx.fillRect(cx-1,cy,3,sy*12);
    ctx.fillStyle='#ff6b6b'; ctx.fillRect(cx+(cx===FX?2:-10),cy+sy*2,8,6*sy);
  }

  // 골대 — 두꺼운 픽셀 프레임 + 체크무늬 그물(대각선 헤치 대신 블록 격자)
  const netWobble = goalFlashTeam && Date.now()<goalFlashUntil
    ? (1-((goalFlashUntil-Date.now())/900)) : 0;
  for (const side of ['L','R']){
    const gx = side==='L' ? FX-GOAL_W : FX+FW;
    const wobbleSign = side==='L' ? (goalFlashTeam==='B'?1:0) : (goalFlashTeam==='A'?1:0);
    const wob = wobbleSign ? (Math.sin(netWobble*Math.PI*3)*(1-netWobble)*4)|0 : 0;
    ctx.fillStyle='rgba(9,19,32,.58)'; ctx.fillRect(gx,GOAL_Y1,GOAL_W,GOAL_H);
    ctx.strokeStyle='rgba(224,242,255,.42)'; ctx.lineWidth=1;
    for (let ny=GOAL_Y1+6;ny<GOAL_Y2;ny+=8){ ctx.beginPath();ctx.moveTo(gx+wob,ny);ctx.lineTo(gx+GOAL_W+wob,ny);ctx.stroke(); }
    for (let nx=gx+3;nx<gx+GOAL_W;nx+=5){ ctx.beginPath();ctx.moveTo(nx+wob,GOAL_Y1);ctx.lineTo(nx+wob,GOAL_Y2);ctx.stroke(); }
    ctx.fillStyle = '#f7fbff';
    ctx.fillRect(gx, GOAL_Y1, GOAL_W, 4); ctx.fillRect(gx, GOAL_Y2-4, GOAL_W, 4);
    ctx.fillRect(side==='L'?gx:gx+GOAL_W-4, GOAL_Y1, 4, GOAL_H);
  }
}

function shadeColor(hex, amt){
  const c = hex.replace('#','');
  const n = parseInt(c.length===3 ? c.split('').map(ch=>ch+ch).join('') : c, 16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = amt<0 ? amt+1 : amt;
  if (amt<0){ r*=f; g*=f; b*=f; } else { r=r+(255-r)*f; g=g+(255-g)*f; b=b+(255-b)*f; }
  return `rgb(${r|0},${g|0},${b|0})`;
}

function jerseyNumberOf(p){ return Math.floor((Number(p.seat)||0)/2)+1; }

function ball_or_netball(){ return isHost ? ball : netBall; }

// 3x5 픽셀 비트맵 숫자(1~4만 필요 — 팀당 최대 4명)
const PIXEL_DIGITS = {
  1: ['.#.','##.','.#.','.#.','###'],
  2: ['###','..#','###','#..','###'],
  3: ['###','..#','###','..#','###'],
  4: ['#.#','#.#','###','..#','..#'],
};
function drawPixelDigit(baseX, baseY, digit, px, color){
  const rows = PIXEL_DIGITS[digit] || PIXEL_DIGITS[1];
  ctx.fillStyle = color;
  for (let y=0;y<rows.length;y++){
    for (let x=0;x<rows[y].length;x++){
      if (rows[y][x]==='#') ctx.fillRect(Math.round(baseX+x*px),Math.round(baseY+y*px),Math.max(1,Math.round(px)),Math.max(1,Math.round(px)));
    }
  }
}

function drawPlayerLegacy(p, mine, sid){
  const now = Date.now();
  const stunned = isStunned(sid, now);
  const dir = Number.isFinite(p.dir) ? p.dir : 0;
  const spd = Math.hypot(p.vx||0, p.vy||0);
  const moving = spd > 0.35;
  const nearBall = !stunned && Math.hypot(ball_or_netball().x-p.x, ball_or_netball().y-p.y) < KICK_RANGE+4;
  const facing = Math.cos(dir) < -0.15 ? -1 : 1;

  ctx.save(); ctx.translate(p.x,p.y);
  const t=now/1000, walkPhase=moving?(Math.floor(t*10)%2):0;
  const bob=Math.round(moving?Math.sin(t*13):Math.sin(t*2.4)*.45);

  // 부드러운 타원 대신 3단 픽셀 그림자
  ctx.fillStyle='rgba(2,20,12,.18)'; ctx.fillRect(-14,12,28,6);
  ctx.fillStyle='rgba(2,20,12,.28)'; ctx.fillRect(-10,14,20,5);
  ctx.fillStyle='rgba(2,20,12,.38)'; ctx.fillRect(-6,16,12,3);

  if (nearBall){
    ctx.fillStyle='#ffe66d'; const R=28;
    [[0,-R],[R,0],[0,R],[-R,0]].forEach(([dx,dy])=>ctx.fillRect(dx-2,dy-2,4,4));
  }
  if (now<tackleActiveUntil && mine){
    ctx.globalAlpha=.22; ctx.fillStyle=p.color;
    ctx.fillRect(-Math.cos(dir)*19-15,-Math.sin(dir)*19-19,30,35); ctx.globalAlpha=1;
  }

  // 작은 16×18 치비 소녀 축구선수. PX=2는 2배 backing canvas에서 실제 4px
  // 단위라 흐림 없이 또렷하고, 이전 PX=2.5보다 화면 점유 크기도 20% 작다.
  const PX=2, W=16, H=18;
  const baseX=-W*PX/2, baseY=-H*PX+13;
  const teamColor=stunned?'#838b94':p.color;
  const OUT=stunned?'#444b53':shadeColor(teamColor,-.48);
  const DARK=stunned?'#5d646d':shadeColor(teamColor,-.25);
  const HI=stunned?'#aeb4ba':shadeColor(teamColor,.28);
  const FACE=stunned?'#b9b9b9':'#f4caa1';
  const INNER=stunned?'#999':'#f28fad';
  const WHITE=stunned?'#d1d1d1':'#f7f8f2';
  const SHOE='#172033', EYE='#18202d';
  const variant=Math.abs(Number(p.seat)||0)%4;
  const HAIR=stunned?'#686d75':['#5a3828','#252c3b','#d49a42','#7b4d76'][variant];
  const HAIR_HI=stunned?'#858a91':['#8b5a3c','#46516a','#f1c56b','#b071a9'][variant];

  ctx.save(); ctx.scale(facing,1); ctx.imageSmoothingEnabled=false;
  const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(baseX+x*PX),Math.round(baseY+(y+bob)*PX),Math.ceil(w*PX),Math.ceil(h*PX));};

  // 작은 치비 소녀 축구선수: 머리카락 실루엣 → 얼굴 → 앞머리 순서.
  // 좌석별로 갈색/남색/금발/보라 머리를 사용하고 팀 색은 머리핀과 유니폼에 둔다.
  if(variant===0){ px(12,3,3,7,OUT); px(13,4,3,5,HAIR); }
  else if(variant===1){ px(2,2,2,9,OUT); px(12,2,2,9,OUT); }
  else if(variant===2){ px(12,3,3,4,OUT); px(13,4,3,3,HAIR); }
  else { px(1,4,3,5,OUT); px(0,5,3,4,HAIR); }

  px(3,1,10,2,OUT); px(2,3,12,7,OUT); px(3,10,10,1,OUT);
  px(3,2,10,3,HAIR); px(3,4,10,5,FACE); px(4,9,8,1,FACE);
  px(3,3,3,3,HAIR); px(6,3,2,2,HAIR_HI); px(10,3,3,3,HAIR);
  px(3,8,2,2,HAIR); px(11,8,2,2,HAIR);
  px(4,7,2,1,INNER); px(10,7,2,1,INNER);
  if (!stunned){
    px(5,5,1,2,EYE); px(10,5,1,2,EYE);
    px(5,5,1,1,'#fff'); px(10,5,1,1,'#fff');
    px(7,8,2,1,INNER);
  } else { px(4,6,2,1,EYE); px(10,6,2,1,EYE); }

  // 팀색 머리핀
  px(11,2,2,1,teamColor); px(12,1,1,3,HI);

  // 몸통/팔: 태클 중이면 앞팔과 몸을 길게 보여 동작을 읽기 쉽게 한다.
  px(3,10,10,5,OUT); px(4,10,8,4,teamColor); px(4,12,8,1,HI);
  if (p.tackle){ px(1,11,3,2,OUT); px(0,12,3,2,teamColor); px(12,10,3,2,OUT); }
  else { px(2,11,2,3,OUT); px(3,11,1,2,FACE); px(12,11,2,3,OUT); px(12,11,1,2,FACE); }
  px(4,14,8,2,OUT); px(5,14,6,2,WHITE);

  const step=walkPhase?1:0, kicking=now<(p._kickPoseUntil||0);
  if(kicking){
    px(4,16,2,2,OUT); px(3,17,3,1,SHOE);
    px(10,15,3,2,OUT); px(12,16,4,2,SHOE);
  }else{
    px(5-step,16,2,2,OUT); px(9+step,16,2,2,OUT);
    px(4-step,17,3,1,SHOE); px(9+step,17,3,1,SHOE);
  }

  drawPixelDigit(baseX+7*PX,baseY+(10.4+bob)*PX,jerseyNumberOf(p),1,'rgba(255,255,255,.96)');
  ctx.restore();

  if (mine&&kickCharging){
    const pct=clamp((now-kickChargeStart)/KICK_CHARGE_MS,0,1);
    ctx.beginPath();ctx.arc(0,0,31,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);
    ctx.strokeStyle='#ffe66d';ctx.lineWidth=4;ctx.stroke();
    // 슛 방향/파워 가이드: 차징 중에만 보여 화면을 어지럽히지 않는다.
    ctx.save(); ctx.rotate(dir);
    const guide=28+Math.round(pct*34);
    ctx.fillStyle=pct>.72?'#fff3a5':'rgba(255,230,109,.82)';
    for(let gx=24;gx<guide;gx+=8) ctx.fillRect(gx,-2,5,4);
    ctx.fillRect(guide,-5,4,10); ctx.fillRect(guide+4,-3,4,6);
    ctx.restore();
  }
  if (mine){
    ctx.fillStyle='#ffe66d';ctx.fillRect(-5,-38,10,3);ctx.fillRect(-3,-41,6,3);ctx.fillRect(-1,-44,2,3);
  }
  if (stunned){ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff59d';ctx.fillText('💫',0,-42);}

  const label=String(p.nick||'Player').slice(0,8), labelW=Math.max(38,Math.min(70,label.length*7+14));
  ctx.fillStyle='rgba(5,14,28,.82)';ctx.fillRect(-labelW/2+3,-56,labelW-6,16);ctx.fillRect(-labelW/2,-53,labelW,10);
  ctx.fillStyle=mine?'#ffe66d':'#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,-48);
  ctx.restore();
}

/* 30×38 오리지널 치비 축구선수 도트(v13).
 * 참고 이미지의 핵심 비율인 큰 머리, 머리와 분리되는 양팔, 짧은 몸통, 서로
 * 확실히 갈라지는 두 다리를 반영했다. 특정 캐릭터를 복제하지 않고 축구복과
 * 네 가지 머리 실루엣으로 새로 구성했으며, 1 논리픽셀 단위만 사용해 흐려지는
 * 1.5배 픽셀을 없앴다. */
function drawPlayer(p,mine,sid){
  const now=Date.now(), stunned=isStunned(sid,now);
  const dir=Number.isFinite(p.dir)?p.dir:0, spd=Math.hypot(p.vx||0,p.vy||0);
  const moving=spd>.3, running=spd>4.15, facing=Math.cos(dir)<-.15?-1:1;
  const b=ball_or_netball(), nearBall=!stunned&&Math.hypot(b.x-p.x,b.y-p.y)<KICK_RANGE+5;
  const phase=moving?(Math.floor(now/(running?80:120))%2):0;
  const bob=moving?(phase?1:0):0, sway=moving?(phase?1:-1):0;
  const kicking=now<(p._kickPoseUntil||0), dribbling=nearBall&&moving&&!kicking;

  ctx.save();
  ctx.translate(Math.round(p.x),Math.round(p.y));
  ctx.fillStyle='rgba(2,18,12,.18)';ctx.fillRect(-14,11,28,5);
  ctx.fillStyle='rgba(2,18,12,.34)';ctx.fillRect(-9,13,18,4);

  if(nearBall){
    ctx.fillStyle='#ffe66d';
    [[0,-25],[25,0],[0,25],[-25,0]].forEach(([x,y])=>ctx.fillRect(x-1.5,y-1.5,3,3));
  }
  if(now<tackleActiveUntil&&mine){
    ctx.globalAlpha=.18;ctx.fillStyle=p.color;
    ctx.fillRect(-Math.cos(dir)*17-13,-Math.sin(dir)*17-18,26,32);ctx.globalAlpha=1;
  }

  // PX=1: 내부 2배 backing canvas에서 정확히 2×2 화면 픽셀이 되어 선명하다.
  const PX=1,W=30,H=38,baseX=-W/2,baseY=-H+14;
  const variant=Math.abs(Number(p.seat)||0)%4;
  const team=stunned?'#818995':p.color;
  const teamDark=stunned?'#5e6570':shadeColor(team,-.34);
  const teamHi=stunned?'#aab0b8':shadeColor(team,.34);
  const hair=stunned?'#686d75':['#296b91','#4d7140','#b56e31','#604c85'][variant];
  const hairDark=stunned?'#454a51':['#17415e','#30492a','#75431f','#3d3159'][variant];
  const hairHi=stunned?'#8d9299':['#63b6d8','#8fc77b','#efb36a','#a88fd0'][variant];
  const skin=stunned?'#b9bbc0':'#f4c7a2',skinShade=stunned?'#96999f':'#dc987e';
  const OUT='#182131',WHITE='#f7f8f2',EYE='#172033',SHOE='#111a2a';
  const sock=stunned?'#d6d8dc':'#eef4ff';
  const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(baseX+x),Math.round(baseY+y+bob),w,h);};

  ctx.save();ctx.scale(facing,1);ctx.imageSmoothingEnabled=false;
  // 뒤쪽 머리: 머리 덩어리와 묶은 머리 끝을 분리해 실루엣부터 읽히게 한다.
  if(variant===0){ // 긴 양갈래
    px(2,7,5,14,hairDark);px(0,11+sway,4,12,hair);px(23,7,5,14,hairDark);px(26,11-sway,4,12,hair);
    px(1,20+sway,3,4,hairHi);px(26,20-sway,3,4,hairHi);
  }else if(variant===1){ // 꽃장식 긴 생머리
    px(4,5,22,18,hairDark);px(3,10,5,15,hair);px(22,10,5,15,hair);px(4,21,3,5,hairHi);px(23,21,3,5,hairHi);
  }else if(variant===2){ // 높은 포니테일
    px(21,3,6,7,hairDark);px(25,6+sway,5,13,hair);px(27,17+sway,3,6,hairHi);
  }else{ // 둥근 보브컷
    px(3,6,24,15,hairDark);px(2,12,5,10,hair);px(23,12,5,10,hair);px(3,19,3,4,hairHi);px(24,19,3,4,hairHi);
  }

  // 큰 머리: 외곽선-얼굴-앞머리-표정 순으로 겹쳐 또렷한 치비 비율을 만든다.
  px(8,1,14,2,OUT);px(5,3,20,3,OUT);px(4,6,22,10,OUT);px(6,16,18,3,OUT);
  px(6,5,18,11,skin);px(8,16,14,2,skin);
  px(6,3,18,4,hair);px(5,6,6,5,hair);px(19,6,6,5,hair);px(10,4,7,3,hairHi);
  px(7,6,4,3,hair);px(13,5,4,3,hair);px(19,6,4,3,hair);
  if(variant===1){ // 작은 꽃 장식
    px(5,2,2,2,WHITE);px(3,4,2,2,WHITE);px(7,4,2,2,WHITE);px(5,6,2,2,WHITE);px(5,4,2,2,teamHi);
  }else{px(21,4,4,2,team);px(22,3,2,4,teamHi);}
  if(!stunned){
    px(9,10,2,3,EYE);px(19,10,2,3,EYE);px(9,10,1,1,WHITE);px(19,10,1,1,WHITE);
    px(7,14,2,1,skinShade);px(21,14,2,1,skinShade);px(14,15,2,1,'#d96d7d');
  }else{px(8,11,4,1,EYE);px(18,11,4,1,EYE);}

  // 목과 짧은 축구 유니폼 몸통.
  px(13,18,4,2,skin);px(9,19,12,2,OUT);px(8,21,14,9,OUT);
  px(10,20,10,2,teamHi);px(9,22,12,6,team);px(10,27,10,2,teamDark);
  px(11,28,8,2,WHITE);
  drawPixelDigit(baseX+13,baseY+22+bob,jerseyNumberOf(p),1,WHITE);

  // 팔은 몸통에서 한 칸 이상 띄워 어깨-팔꿈치-손이 각각 보이게 한다.
  const armSwing=moving?(phase?1:-1):0;
  if(p.tackle){
    px(4,21,4,3,OUT);px(1,22,5,2,team);px(0,23,2,2,skin);
    px(21,20,5,3,OUT);px(25,20,4,2,team);px(28,20,2,2,skin);
  }else{
    px(5,21+armSwing,3,6,OUT);px(6,22+armSwing,2,4,team);px(5,26+armSwing,3,3,skin);
    px(22,21-armSwing,3,6,OUT);px(22,22-armSwing,2,4,team);px(22,26-armSwing,3,3,skin);
  }

  // 반바지와 완전히 분리된 두 다리. 발차기/드리블 때 무릎과 신발 방향도 바뀐다.
  px(9,29,5,3,teamDark);px(16,29,5,3,teamDark);
  if(kicking){
    px(10,32,4,4,skin);px(10,35,4,2,sock);px(9,37,6,2,SHOE);
    px(17,31,4,3,skin);px(20,32,5,3,skin);px(24,33,3,2,sock);px(26,33,4,2,SHOE);
  }else if(dribbling){
    px(10,32,4,4,skin);px(9,35,5,2,sock);px(8,37,7,2,SHOE);
    px(17,31,4,4,skin);px(19,34,4,2,sock);px(21,36,6,2,SHOE);
  }else{
    const step=phase?1:0;
    px(10-step,32,4,4,skin);px(10-step,35,4,2,sock);px(8-step,37,7,2,SHOE);
    px(17+step,32,4,4,skin);px(17+step,35,4,2,sock);px(17+step,37,7,2,SHOE);
  }
  ctx.restore();

  if(mine&&kickCharging){
    const pct=clamp((now-kickChargeStart)/KICK_CHARGE_MS,0,1);
    ctx.beginPath();ctx.arc(0,0,28,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);
    ctx.strokeStyle='#ffe66d';ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.rotate(dir);const guide=25+Math.round(pct*31);
    ctx.fillStyle=pct>.72?'#fff3a5':'rgba(255,230,109,.85)';
    for(let gx=22;gx<guide;gx+=7)ctx.fillRect(gx,-1.5,4,3);
    ctx.fillRect(guide,-4,3,8);ctx.restore();
  }
  if(mine){ctx.fillStyle='#ffe66d';ctx.fillRect(-4,-36,8,2);ctx.fillRect(-2,-39,4,3);}
  if(stunned){ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff59d';ctx.fillText('💫',0,-38);}

  const label=String(p.nick||'Player').slice(0,8),labelW=Math.max(34,Math.min(66,label.length*6.5+12));
  ctx.fillStyle='rgba(5,14,28,.84)';ctx.fillRect(-labelW/2,-51,labelW,13);
  ctx.fillStyle=mine?'#ffe66d':'#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,-44.5);
  ctx.restore();
}

function drawBallTrail(){
  for (const t of ballTrail){
    ctx.save();
    ctx.globalAlpha = clamp(t.life,0,1)*0.3;
    const s = 3 + 5*clamp(t.life,0,1);
    ctx.fillStyle = '#dff7ff';
    ctx.fillRect(Math.round(t.x-s/2), Math.round(t.y-s/2), Math.round(s), Math.round(s));
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(t.x-s/4), Math.round(t.y-s/4), Math.max(2,Math.round(s/2)), Math.max(2,Math.round(s/2)));
    ctx.restore();
  }
}

function drawRings(){
  for (const r of rings){
    ctx.save();
    ctx.globalAlpha = clamp(r.alpha,0,1);
    ctx.strokeStyle = r.color; ctx.lineWidth = 2.4;
    ctx.strokeRect(r.x-r.r, r.y-r.r, r.r*2, r.r*2);
    ctx.restore();
  }
}

// 12x12 원형 픽셀 공. 물리 반지름(BR)은 그대로 두고 그림만 개선해 판정은 바뀌지 않는다.
const BALL_SHAPE = [
  '....####....','..########..','.##########.','############',
  '############','############','############','############',
  '############','.##########.','..########..','....####....'
];
const BALL_INNER = [
  '............','....####....','..########..','.##########.',
  '.##########.','.##########.','.##########.','.##########.',
  '.##########.','..########..','....####....','............'
];
const BALL_PATCHES = [
  [[5,3],[6,3],[4,4],[5,4],[6,4],[7,4],[5,5],[6,5],[2,7],[3,7],[8,8],[9,8]],
  [[7,3],[8,3],[6,4],[7,4],[8,4],[9,4],[7,5],[8,5],[3,8],[4,8],[7,9]],
  [[5,6],[6,6],[4,7],[5,7],[6,7],[7,7],[5,8],[6,8],[2,3],[3,3],[8,4],[9,4]],
  [[3,4],[4,4],[2,5],[3,5],[4,5],[5,5],[3,6],[4,6],[7,8],[8,8],[8,9]]
];
function drawBall(b){
  ctx.save();
  ctx.fillStyle='rgba(2,12,18,.32)';
  ctx.fillRect(Math.round(b.x-10),Math.round(b.y+9),20,4);
  ctx.fillStyle='rgba(2,12,18,.18)';
  ctx.fillRect(Math.round(b.x-7),Math.round(b.y+13),14,2);

  const BPX=2, bx0=Math.round(b.x-12), by0=Math.round(b.y-12);
  for(let y=0;y<12;y++) for(let x=0;x<12;x++){
    if(BALL_SHAPE[y][x]==='#'){
      ctx.fillStyle='#101923';
      ctx.fillRect(bx0+x*BPX,by0+y*BPX,BPX,BPX);
    }
  }
  for(let y=0;y<12;y++) for(let x=0;x<12;x++){
    if(BALL_INNER[y][x]==='#'){
      ctx.fillStyle=y>7?'#cbd5dc':'#f7fbf7';
      ctx.fillRect(bx0+x*BPX,by0+y*BPX,BPX,BPX);
    }
  }
  const speed=Math.hypot(b.vx||0,b.vy||0);
  const spinPhase=Math.floor(Date.now()/(speed>1?75:240)+Math.abs(b.x||0)/18)%BALL_PATCHES.length;
  ctx.fillStyle='#263746';
  for(const [x,y] of BALL_PATCHES[spinPhase]){
    if(BALL_INNER[y]?.[x]==='#') ctx.fillRect(bx0+x*BPX,by0+y*BPX,BPX,BPX);
  }
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillRect(bx0+4*BPX,by0+2*BPX,2*BPX,BPX);
  ctx.fillRect(bx0+3*BPX,by0+3*BPX,BPX,BPX);
  ctx.restore();
}


function drawParticles(){
  for (const pt of particles){
    ctx.save();
    ctx.globalAlpha = clamp(pt.life,0,1);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
    ctx.restore();
  }
}

function drawHUD(){
  const now = Date.now();
  ctx.fillStyle='#071827'; ctx.fillRect(0,0,CW,FY-4);
  ctx.fillStyle='#123044'; ctx.fillRect(0,FY-8,CW,4);
  ctx.fillStyle='#1c4b60'; ctx.fillRect(0,FY-8,CW,1);
  ctx.fillStyle='#102638'; ctx.fillRect(12,8,120,32); ctx.fillRect(CW-132,8,120,32);
  ctx.fillStyle='#020b12'; ctx.fillRect(CW/2-64,5,128,40);
  ctx.fillStyle='#e8d36a'; ctx.fillRect(CW/2-64,5,128,2); ctx.fillRect(CW/2-64,43,128,2);
  ctx.textBaseline='middle';

  const popScale = (t)=> t>0 && now-t<300 ? 1+0.5*(1-(now-t)/300) : 1;
  ctx.save();
  ctx.translate(16,(FY-4)/2); ctx.scale(popScale(scoreAnimA), popScale(scoreAnimA));
  ctx.font='bold 21px monospace'; ctx.fillStyle='#ff7777'; ctx.textAlign='left';
  ctx.fillText('RED '+score.A, 0, 0);
  ctx.restore();

  ctx.save();
  ctx.translate(CW-16,(FY-4)/2); ctx.scale(popScale(scoreAnimB), popScale(scoreAnimB));
  ctx.font='bold 21px monospace'; ctx.fillStyle='#70a8ff'; ctx.textAlign='right';
  ctx.fillText(score.B+' BLUE', 0, 0);
  ctx.restore();

  let sec = Math.max(0, Math.ceil((durationMs-(now-startTs))/1000));
  if (!startTs) sec = Math.ceil(durationMs/1000);
  const lowTime = sec<=10 && gameActive && !gameOver;
  ctx.font='bold 21px monospace'; ctx.textAlign='center';
  ctx.fillStyle = lowTime ? (Math.floor(now/300)%2===0 ? '#ff4d4d' : '#fff') : '#fff';
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');
  ctx.fillText(mm+':'+ss, CW/2, (FY-4)/2);
}

function drawKickoffCountdown(){
  if (kickoffUntil<=0) return;
  const left = kickoffUntil - Date.now();
  if (left<=0) return;
  const sec = Math.ceil(left/1000);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(FX,FY,FW,FH);
  ctx.font='bold 64px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff';
  ctx.fillText(sec<=0 ? 'GO!' : String(sec), FX+FW/2, FY+FH/2);
  ctx.restore();
}

function drawGoalFlash(){
  if (!goalFlashTeam || Date.now()>goalFlashUntil) { goalFlashTeam=null; return; }
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = goalFlashTeam==='A' ? '#e74c3c' : '#3b82f6';
  ctx.fillRect(0,0,CW,CH);
  ctx.globalAlpha = 1;
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('GOAL!', CW/2, CH/2);
  ctx.restore();
}

function draw(){
  ctx.save();
  const now = Date.now();
  if (now < shakeUntil){
    const decay = (shakeUntil-now)/300;
    const mag = shakeMag*clamp(decay,0,1);
    ctx.translate((Math.random()*2-1)*mag, (Math.random()*2-1)*mag);
  } else {
    shakeMag = 0;
  }
  drawField();
  drawBallTrail();
  for (const [sid,p] of Object.entries(players)) if (sid!==mySid) drawPlayer(p, false, sid);
  if (me) drawPlayer(me, true, mySid);
  drawBall(ball_or_netball());
  drawRings();
  drawParticles();
  drawKickoffCountdown();
  ctx.restore();
  drawHUD();
  drawGoalFlash();
}

/* ── 게임 루프 (프레임 하나의 예외가 루프 전체를 죽이지 않도록 격리) ── */
let loopRunning = false;
function startLoop(){
  if (loopRunning) return; loopRunning = true;
  function tick(){
    try{
      updateKickoffCountdown();
      updateMe(); lerpRemote(); updateNetBall(); updateBallHost();
      updateBallImpactFx(); updateBallTrail(); updateRings();
      updateParticles(); netSends(); checkTimer(); draw();
    }catch(err){
      try{ console.error('[soccer] frame error (자동 복구됨):', err); }catch(_){}
    }
    requestAnimationFrame(tick);
  }
  tick();
}

/* ── 브릿지 메시지 수신 ── */
window.addEventListener('message', e=>{
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  if (d.type === 'bridge_init'){
    mySid = String(d.sessionId||'');
    myNick = String(d.nick||'Player');
    mySeat = Number(d.seat ?? -1);
    isHost = !!d.isHost;

    const incoming = (d.players||[]).map(p=>({
      sid: String(p.sid||p.sessionId||''),
      nick: String(p.nick||'Player'),
      seat: Number(p.seat ?? -1),
      isHost: !!p.isHost,
    })).filter(p=>p.seat>=0);

    if (gameInitialized){ applyRoster(incoming); return; }
    gameInitialized = true;
    roster = incoming;
    const sAt = Number(d.startedAt||0);
    startTs = sAt>0 ? sAt : Date.now();
    initGame();
    bridgeSend('sc_sync', {});
    return;
  }

  // room.js는 room.state.players(방 전체의 실시간 상태)를 감시하다가 방장이
  // 바뀔 때마다 이 메시지를 보내준다 — 투게스터 등 다른 협동 게임들이 방장
  // 승계를 안정적으로 처리하는 데 쓰는 바로 그 채널이다. sc_roster는 축구
  // 전용 보조 채널이라 타이밍이 늦거나 빠질 수 있으니, 항상 이걸 1차 소스로
  // 삼는다.
  if (d.type === 'bridge_host'){
    const prevHost = isHost;
    isHost = !!d.isHost;
    if (isHost && !prevHost){
      // 막 방장이 됐다면, 기존에 보던 netBall 위치/속도를 그대로 물려받아
      // 공이 순간이동하듯 튀지 않게 하고, 즉시 공 계산을 이어받는다.
      ball = { x:netBall.x, y:netBall.y, vx:netBall.vx||0, vy:netBall.vy||0 };
      lastBallSpeedSeen = Math.hypot(ball.vx, ball.vy);
    }
    return;
  }

  if (d.type === 'sc_timer'){
    const t = Number(d.startTs||0);
    if (t>0) startTs = t;
    if (d.durationMs) durationMs = Number(d.durationMs);
    return;
  }

  if (d.type === 'sc_players'){
    applyRemotePlayers(d.players);
    return;
  }

  if (d.type === 'sc_ball'){
    netBall.netX = Number(d.x ?? netBall.netX);
    netBall.netY = Number(d.y ?? netBall.netY);
    netBall.vx = Number(d.vx ?? 0);
    netBall.vy = Number(d.vy ?? 0);
    netBall.netT = Date.now();
    if(d.impactAt){
      netBall.impactAt=String(d.impactAt);
      netBall.impactPower=Number(d.impactPower||0);
      netBall.impactDir=Number(d.impactDir||0);
      playKickImpactOnce(netBall.impactAt,netBall.netX,netBall.netY,netBall.impactPower,netBall.impactDir);
      lastBallSpeedSeen=Math.hypot(netBall.vx,netBall.vy);
    }
    return;
  }

  if (d.type === 'sc_goal' || d.type === 'sc_goal_sync' || d.type === 'sc_score_sync'){
    const newA = Number(d.scoreA ?? score.A), newB = Number(d.scoreB ?? score.B);
    if (newA !== score.A) scoreAnimA = Date.now();
    if (newB !== score.B) scoreAnimB = Date.now();
    score.A = newA; score.B = newB;
    if (d.type === 'sc_goal' && !isHost){ showGoalFlash(d.team); spawnGoalParticles(d.team); sfxGoal(); addShake(8,400); }
    return;
  }

  if (d.type === 'sc_stun'){
    const sid = String(d.sid||''); const dur = Number(d.dur||0);
    if (sid && dur>0) applyStun(sid, dur, false);
    return;
  }

  if (d.type === 'sc_roster'){
    applyRoster(d.players||[]);
    return;
  }

  if (d.type === 'sc_end'){
    gameOver = true; gameActive = false;
    sfxWhistle(true);
    const a = Number(d.scoreA ?? score.A), b = Number(d.scoreB ?? score.B);
    const winner = d.winner || (a===b ? 'draw' : (a>b?'A':'B'));
    const msg = winner==='draw' ? '무승부!' : (winner==='A' ? '🔴 A팀 승리!' : '🔵 B팀 승리!');
    showOverlay(msg, `최종 스코어  A ${a} : ${b} B`);
    return;
  }
});

bridgeSend('bridge_ready', {});
</script>
