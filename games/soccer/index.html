<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>⚽ 수학축구</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none;
      -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; background:#0b1220; overflow:hidden;
      font-family:'Segoe UI',system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; overflow:hidden; background:#13261b; }
  #gc { position:absolute; left:50%; top:50%; background:#163f2a; display:block; touch-action:none;
      image-rendering:crisp-edges; image-rendering:pixelated; transform:translate(-50%,-50%) translateZ(0);
      backface-visibility:hidden; border:0; box-shadow:none; }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(0,0,0,.72); color:#fff;
    text-align:center; padding:24px; z-index:20;
  }
  #overlay.hidden { display:none; }
  #overlay h2 { font-size:22px; }
  #overlay p { font-size:14px; opacity:.85; line-height:1.6; }
  #joy {
    position:fixed; left:22px; bottom:22px; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); z-index:15; display:none;
  }
  #joyStick {
    position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:rgba(255,255,255,.55);
  }
  body.mobile #joy { display:block; }
  #actionBtns { position:fixed; right:18px; left:auto; bottom:18px; z-index:15; display:flex;
      flex-direction:row; gap:10px; align-items:flex-end; }
  body.mobile #actionBtns { left:auto; right:18px; bottom:22px; }
  body:not(.mobile) #kickBtn { display:none; }
  .actBtn {
    width:64px; height:58px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:rgba(255,255,255,.96); text-align:center; line-height:1.15;
    position:relative; overflow:hidden; isolation:isolate;
    border:1px solid rgba(255,255,255,.26);
    background:linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.12) 18%, rgba(255,255,255,.08) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.46), inset 0 -8px 14px rgba(0,0,0,.14), 0 8px 18px rgba(0,0,0,.18);
    backdrop-filter:blur(7px) saturate(1.18); -webkit-backdrop-filter:blur(7px) saturate(1.18);
  }
  .actBtn::before{
    content:''; position:absolute; left:7px; right:7px; top:5px; height:44%; border-radius:11px;
    background:linear-gradient(180deg, rgba(255,255,255,.52) 0%, rgba(255,255,255,.20) 46%, rgba(255,255,255,0) 100%);
    pointer-events:none; z-index:0;
  }
  .actBtn::after{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), inset 0 -10px 16px rgba(255,255,255,.05);
  }
  .actBtn .chargeFill,.actBtn .coolFill{ position:absolute; left:0; right:0; bottom:0; height:0%; transition:height .05s linear; z-index:0; }
  .actBtn .chargeFill{ background:linear-gradient(180deg, rgba(255,232,130,.18) 0%, rgba(255,214,64,.50) 70%, rgba(255,187,0,.62) 100%); }
  .actBtn .coolFill{ background:linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.20) 100%); transition:height .04s linear; }
  .actBtn.cooling { opacity:.46; filter:saturate(.88); }
  .actBtn span{ position:relative; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.28); letter-spacing:-.1px; }
  #kickBtn { background:linear-gradient(180deg, rgba(255,120,120,.38) 0%, rgba(218,64,64,.24) 100%); }
  #jumpBtn { background:linear-gradient(180deg, rgba(255,208,126,.36) 0%, rgba(234,156,36,.24) 100%); }
  #tackleBtn { background:linear-gradient(180deg, rgba(141,198,255,.34) 0%, rgba(59,130,246,.23) 100%); }
  body.mobile .actBtn{border-radius:50%;width:68px;height:68px;}
  body:not(.mobile) .actBtn{min-width:64px;}

  #scoreHud {
    position:fixed; left:50%; top:max(8px, env(safe-area-inset-top)); transform:translateX(-50%);
    z-index:18; display:grid; grid-template-columns:88px 72px 88px; align-items:stretch;
    height:38px; padding:4px; gap:4px; pointer-events:none;
    color:#fff; background:#20252a; border:0;
    clip-path:polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px);
    box-shadow:0 4px 0 #0e1114, 0 8px 0 rgba(0,0,0,.28);
    image-rendering:pixelated;
    font-family:"Courier New",ui-monospace,monospace;
  }
  #scoreHud::before {
    content:''; position:absolute; inset:4px; pointer-events:none;
    border:2px solid #778086; opacity:.72;
  }
  #scoreHud .team,
  #scoreHud .clock {
    position:relative; height:30px; display:flex; align-items:center; justify-content:center;
    box-sizing:border-box; border:2px solid #11161a;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.28);
    text-shadow:2px 2px 0 #11161a;
  }
  #scoreHud .team { gap:7px; font-size:11px; font-weight:900; letter-spacing:1px; }
  #scoreHud .red { background:#9f3e42; color:#ffe9da; }
  #scoreHud .blue { background:#3c6097; color:#e2efff; }
  #scoreHud .score {
    min-width:20px; font-size:20px; line-height:1; color:#fffbe6; text-align:center;
    font-weight:900; letter-spacing:0; text-shadow:2px 0 #11161a,-2px 0 #11161a,0 2px #11161a,0 -2px #11161a;
  }
  #scoreHud .clock {
    width:auto; background:#e3cf8d; color:#2c2921; font-size:14px; font-weight:900;
    letter-spacing:1px; text-shadow:1px 1px 0 #fff0b5;
  }
  #scoreHud.low .clock { color:#a52f31; animation:scorePulse .6s steps(2,end) infinite; }
  @keyframes scorePulse { 50% { filter:brightness(1.22); } }
  body.mobile #scoreHud {
    top:max(5px, env(safe-area-inset-top)); grid-template-columns:70px 58px 70px;
    height:34px; padding:3px; gap:3px; box-shadow:0 3px 0 #0e1114,0 6px 0 rgba(0,0,0,.24);
  }
  body.mobile #scoreHud::before { inset:3px; }
  body.mobile #scoreHud .team, body.mobile #scoreHud .clock { height:28px; border-width:2px; }
  body.mobile #scoreHud .team { font-size:9px; gap:4px; letter-spacing:.5px; }
  body.mobile #scoreHud .score { min-width:17px; font-size:17px; }
  body.mobile #scoreHud .clock { font-size:11px; }
  @media (max-width:430px) {
    #joy { left:14px; bottom:16px; width:108px; height:108px; }
    #actionBtns { right:12px; bottom:16px; gap:7px; }
    .actBtn { width:61px; height:61px; font-size:11px; }
  }

  #mathKickoff{position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:auto;padding:8px;box-sizing:border-box;z-index:45;background:rgba(5,11,20,.92);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;touch-action:manipulation;backdrop-filter:blur(2px)}
  #mathKickoff.show{display:flex}
  #mathKickoff::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px),radial-gradient(circle at 50% 110%,rgba(63,184,92,.30),transparent 48%)}
  .mk-panel{position:relative;width:min(760px,94vw);min-height:448px;max-height:calc(100vh - 16px);overflow:auto;padding:20px;border:4px solid #e9f1cf;border-radius:8px;background:#153525;box-shadow:0 0 0 4px #07130d,0 16px 0 rgba(0,0,0,.34),0 26px 55px rgba(0,0,0,.5);text-align:center;color:#fff;box-sizing:border-box;image-rendering:pixelated;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .mk-panel::before{content:"";position:absolute;inset:8px;border:2px dashed rgba(235,255,226,.22);pointer-events:none}
  .mk-panel::after{content:"";position:absolute;left:0;right:0;top:75px;height:5px;background:repeating-linear-gradient(90deg,#f1f6d7 0 18px,transparent 18px 32px);opacity:.35;pointer-events:none}
  .mk-header{position:relative;display:grid;grid-template-columns:120px 1fr 112px;gap:10px;align-items:center;z-index:1}
  .mk-phase{justify-self:stretch;padding:8px 7px;border:3px solid #17281e;border-radius:4px;background:#e9f1cf;color:#183124;font-size:13px;font-weight:1000;box-shadow:0 4px 0 #09150e}
  .mk-title{font-size:30px;font-weight:1000;letter-spacing:-1px;text-shadow:0 3px 0 #07130d}
  .mk-sub{position:relative;margin-top:8px;font-size:15px;color:#e8f9eb;font-weight:900;z-index:1}
  .mk-timer{justify-self:stretch;padding:7px 5px;border:3px solid #17281e;border-radius:4px;background:#f5f7df;color:#13271b;font-size:24px;font-weight:1000;box-shadow:0 4px 0 #09150e;font-variant-numeric:tabular-nums}
  .mk-timer.danger{color:#fff;background:#d83f48;animation:mkTimerDanger .45s steps(2,end) infinite}
  @keyframes mkTimerDanger{50%{transform:scale(1.06);filter:brightness(1.22)}}
  .mk-vs{position:relative;display:flex;justify-content:center;align-items:stretch;gap:12px;margin:17px 0 13px;z-index:1}
  .mk-team-box{min-width:154px;padding:10px 14px;border:3px solid #f4f6de;border-radius:5px;box-shadow:0 6px 0 #08120d}
  .mk-team-box.red{background:#b83f49}.mk-team-box.blue{background:#3767aa}
  .mk-team-label{font-size:15px;font-weight:1000;letter-spacing:2px}
  .mk-team-score{margin-top:3px;font-size:40px;line-height:1;font-weight:1000;text-shadow:0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
  .mk-team-score.pop{animation:mkScorePop .28s steps(3,end)}
  @keyframes mkScorePop{0%{transform:scale(.25);opacity:.1}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
  .mk-team-note{margin-top:4px;font-size:12px;font-weight:900;opacity:.92}
  .mk-versus{display:flex;align-items:center;justify-content:center;min-width:64px;font-size:27px;font-weight:1000;color:#ffe574;text-shadow:0 3px 0 #07130d}
  .mk-problem-wrap{position:relative;z-index:1;max-width:630px;margin:0 auto;padding:18px 14px 16px;border:4px solid #e7eed1;border-radius:6px;background:#0b1b12;box-shadow:inset 0 0 0 3px #254e36,0 7px 0 #07120c}
  .mk-problem{font-size:48px;line-height:1.15;font-weight:1000;text-shadow:0 4px 0 #000;min-height:58px;display:flex;align-items:center;justify-content:center}
  .mk-feedback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;padding:9px 18px;border:4px solid #fff;border-radius:5px;font-size:31px;font-weight:1000;box-shadow:0 7px 0 rgba(0,0,0,.35)}
  .mk-feedback.show{opacity:1}.mk-feedback.good{background:#ffd84d;color:#633900;animation:mkGoodPop .22s steps(4,end) both}.mk-feedback.bad{background:#d83f48;color:#fff;animation:mkBadBlink .3s steps(1,end) 2}
  @keyframes mkGoodPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes mkBadBlink{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.06;transform:translate(-50%,-50%) scale(1.1)}}
  .mk-choices{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;max-width:560px;margin:14px auto 0;z-index:1}
  .mk-choice{border:3px solid #15261b;border-radius:5px;padding:13px 6px;background:#edf4dc;color:#183124;font-size:28px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 #07120c;transition:transform .06s}
  .mk-choice:hover{filter:brightness(1.06)}.mk-choice:active{transform:translateY(3px);box-shadow:0 2px 0 #07120c}.mk-choice.good{background:#62d37e;color:#0b3a1b}.mk-choice.bad{background:#e65a64;color:#fff}.mk-choice:disabled{opacity:1}
  .mk-status-row{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:13px;z-index:1}
  .mk-me,.mk-help{padding:8px 13px;border:2px solid rgba(255,255,255,.5);border-radius:4px;font-weight:1000;box-shadow:0 3px 0 #08120d}.mk-me{background:#ffe574;color:#624600}.mk-help{background:#244f36;color:#eefdf4}
  .mk-result{position:relative;z-index:1;min-height:42px;margin-top:13px;font-size:30px;font-weight:1000;letter-spacing:-.5px;text-shadow:0 4px 0 #07130d}.mk-result.red{color:#ffb3b7}.mk-result.blue{color:#b8d7ff}
  .mk-coin{display:none;position:relative;z-index:1;margin:7px auto 0;font-size:60px;filter:drop-shadow(0 5px 0 #07130d);animation:mkcoin .36s steps(6,end) infinite}.mk-coin.show{display:block}
  @keyframes mkcoin{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(.65)}100%{transform:rotateY(360deg) scale(1)}}

  @media (max-height:500px) and (orientation:landscape){
    #mathKickoff{align-items:flex-start;padding:5px}
    .mk-panel{width:min(900px,98vw);min-height:0;max-height:calc(100vh - 10px);padding:9px 12px 10px;border-width:3px}
    .mk-panel::before{inset:5px}.mk-panel::after{top:47px;height:3px}
    .mk-header{grid-template-columns:95px 1fr 86px;gap:7px}
    .mk-phase{padding:4px 5px;border-width:2px;font-size:10px;box-shadow:0 2px 0 #09150e}
    .mk-title{font-size:20px}.mk-timer{padding:4px;border-width:2px;font-size:17px;box-shadow:0 2px 0 #09150e}
    .mk-sub{margin-top:4px;font-size:11px}
    .mk-vs{gap:7px;margin:7px 0 6px}.mk-team-box{min-width:110px;padding:5px 9px;border-width:2px;box-shadow:0 3px 0 #08120d}
    .mk-team-label{font-size:11px}.mk-team-score{font-size:25px}.mk-team-note{margin-top:1px;font-size:9px}.mk-versus{min-width:42px;font-size:18px}
    .mk-problem-wrap{max-width:570px;padding:8px 10px;border-width:3px;box-shadow:inset 0 0 0 2px #254e36,0 3px 0 #07120c}
    .mk-problem{font-size:29px;min-height:34px}.mk-feedback{font-size:21px;padding:5px 10px;border-width:3px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
    .mk-choices{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:650px;margin-top:7px}
    .mk-choice{padding:7px 3px;border-width:2px;font-size:19px;box-shadow:0 3px 0 #07120c}
    .mk-status-row{margin-top:6px;gap:6px}.mk-me,.mk-help{padding:4px 8px;border-width:1px;font-size:10px;box-shadow:0 2px 0 #08120d}
    .mk-result{min-height:22px;margin-top:5px;font-size:19px}.mk-coin{margin-top:2px;font-size:37px}
  }

  body.mobile .mk-panel{padding:15px 12px 17px;min-height:400px}
  body.mobile .mk-header{grid-template-columns:1fr auto;grid-template-areas:"phase timer" "title title";row-gap:8px}
  body.mobile .mk-phase{grid-area:phase;font-size:12px;padding:6px 8px}body.mobile .mk-title{grid-area:title;font-size:23px}body.mobile .mk-timer{grid-area:timer;min-width:82px;font-size:20px;padding:6px 7px}
  body.mobile .mk-sub{font-size:13px}body.mobile .mk-vs{gap:7px}body.mobile .mk-team-box{min-width:110px;padding:9px 7px}body.mobile .mk-team-score{font-size:31px}body.mobile .mk-versus{min-width:38px;font-size:21px}
  body.mobile .mk-problem-wrap{padding:15px 10px}body.mobile .mk-problem{font-size:34px;min-height:46px}body.mobile .mk-feedback{font-size:24px;padding:7px 13px}body.mobile .mk-choice{font-size:23px;padding:11px 4px}body.mobile .mk-result{font-size:23px;min-height:34px}


  @media (orientation:portrait) and (max-width:600px){
    #mathKickoff{align-items:center;padding:6px;overflow:hidden}
    body.mobile .mk-panel{width:min(96vw,460px);min-height:0;max-height:calc(100dvh - 12px);overflow:hidden;padding:11px 10px 12px;border-width:3px}
    body.mobile .mk-panel::before{inset:5px}
    body.mobile .mk-panel::after{top:57px;height:3px}
    body.mobile .mk-header{grid-template-columns:1fr auto;grid-template-areas:"phase timer" "title title";gap:5px 7px;row-gap:5px}
    body.mobile .mk-phase{font-size:10px;padding:4px 7px}
    body.mobile .mk-title{font-size:20px;line-height:1.08}
    body.mobile .mk-timer{min-width:72px;font-size:18px;padding:4px 6px}
    body.mobile .mk-sub{margin-top:4px;font-size:11px;line-height:1.18}
    body.mobile .mk-vs{gap:5px;margin:9px 0 8px}
    body.mobile .mk-team-box{min-width:0;flex:1;padding:6px 5px;border-width:2px;border-radius:11px}
    body.mobile .mk-team-label{font-size:12px}
    body.mobile .mk-team-score{font-size:27px}
    body.mobile .mk-team-note{font-size:9px}
    body.mobile .mk-versus{min-width:30px;font-size:17px}
    body.mobile .mk-problem-wrap{padding:10px 8px 9px;border-width:3px;border-radius:14px}
    body.mobile .mk-problem{font-size:31px;min-height:39px}
    body.mobile .mk-feedback{font-size:21px;padding:5px 10px;border-width:2px}
    body.mobile .mk-choices{gap:7px;margin-top:8px}
    body.mobile .mk-choice{font-size:21px;padding:9px 3px;border-width:2px;border-radius:11px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
    body.mobile .mk-status-row{gap:5px;margin-top:8px}
    body.mobile .mk-me,body.mobile .mk-help{padding:6px 8px;font-size:10px;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.14)}
    body.mobile .mk-result{margin-top:8px;font-size:20px;min-height:28px;line-height:1.15}
    body.mobile .mk-coin{font-size:46px;margin-top:4px}
  }
  @media (orientation:portrait) and (max-width:380px){
    body.mobile .mk-panel{padding:9px 8px 10px}
    body.mobile .mk-title{font-size:18px}
    body.mobile .mk-team-score{font-size:24px}
    body.mobile .mk-problem{font-size:28px}
    body.mobile .mk-choice{font-size:19px;padding:8px 2px}
    body.mobile .mk-help{display:none}
  }
  @media (orientation:portrait) and (max-height:700px){
    body.mobile .mk-panel{max-height:calc(100dvh - 8px);padding-top:8px;padding-bottom:8px}
    body.mobile .mk-sub{font-size:10px}
    body.mobile .mk-vs{margin:6px 0}
    body.mobile .mk-team-box{padding:4px}
    body.mobile .mk-team-score{font-size:23px}
    body.mobile .mk-problem-wrap{padding:7px}
    body.mobile .mk-problem{font-size:27px;min-height:34px}
    body.mobile .mk-choice{font-size:18px;padding:7px 2px}
    body.mobile .mk-status-row{margin-top:6px}
    body.mobile .mk-result{margin-top:6px;font-size:18px;min-height:22px}
    body.mobile .mk-help{display:none}
  }
  @media (max-height:500px) and (orientation:landscape){
    body.mobile .mk-panel{width:min(900px,98vw);min-height:0;max-height:calc(100vh - 10px);padding:9px 12px 10px}
    body.mobile .mk-header{grid-template-columns:95px 1fr 86px;grid-template-areas:none;row-gap:0}
    body.mobile .mk-phase{grid-area:auto;font-size:10px;padding:4px 5px}
    body.mobile .mk-title{grid-area:auto;font-size:20px}
    body.mobile .mk-timer{grid-area:auto;min-width:0;font-size:17px;padding:4px}
    body.mobile .mk-sub{font-size:11px}
    body.mobile .mk-vs{gap:7px}
    body.mobile .mk-team-box{min-width:110px;padding:5px 9px}
    body.mobile .mk-team-score{font-size:25px}
    body.mobile .mk-versus{min-width:42px;font-size:18px}
    body.mobile .mk-problem-wrap{padding:8px 10px}
    body.mobile .mk-problem{font-size:29px;min-height:34px}
    body.mobile .mk-feedback{font-size:21px;padding:5px 10px}
    body.mobile .mk-choice{font-size:19px;padding:7px 3px}
    body.mobile .mk-result{font-size:19px;min-height:22px}
  }

</style>
</head>
<body>
<div id="wrap"><canvas id="gc"></canvas></div>
<div id="scoreHud"><div class="team red"><span>RED</span><span id="scoreA" class="score">0</span></div><div id="scoreClock" class="clock">02:00</div><div class="team blue"><span id="scoreB" class="score">0</span><span>BLUE</span></div></div>
<div id="joy"><div id="joyStick"></div></div>
<div id="actionBtns">
  <div id="jumpBtn" class="actBtn"><div class="coolFill" id="headerCoolFill"></div><span>헤딩<br>X</span></div>
  <div id="tackleBtn" class="actBtn"><div class="coolFill" id="tackleCoolFill"></div><span>태클<br>C</span></div>
  <div id="kickBtn" class="actBtn"><div class="chargeFill" id="kickChargeFill"></div><span>킥<br>Z</span></div>
</div>
<div id="overlay"><h2 id="ovTitle">연결 대기 중...</h2><p id="ovText">잠시만 기다려주세요.</p></div>
<div id="mathKickoff" aria-live="polite">
  <div class="mk-panel" id="mkPanel">
