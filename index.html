<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>로비</title>
  <link rel="icon" href="./favicon.ico"/>
  <link rel="preload" as="image" type="image/webp" href="./assets/images/backgrounds/lobby-world.webp"/>
  <link rel="stylesheet" href="./css/styles.css?v=20260831-create-room-v1"/>
</head>
<body class="page-lobby">
  <div class="app">
    <div class="topbar slim lobbyTopbar">
      <div class="lobbyIdentity">
        <span class="lobbyMark" aria-hidden="true">MP</span>
        <div>
          <b>게임 라운지</b>
          <span class="nickChip"><span class="dot ok"></span><span class="srOnly">닉네임:</span><b id="myId">-</b></span>
        </div>
      </div>
      <div class="actions">
        <button class="iconbtn" id="openCreate" title="방 만들기" aria-label="방 만들기">➕</button>
        <button class="iconbtn" id="refreshRooms" title="새로고침" aria-label="새로고침">🔄</button>
        <button class="iconbtn" id="toggleFullscreen" title="전체화면" aria-label="전체화면">⛶</button>
        <button class="iconbtn" id="toggleMute" title="음소거" aria-label="음소거">🔊</button>
        <button class="iconbtn" id="logoutBtn" title="로그아웃" aria-label="로그아웃">🚪</button>
      </div>
    </div>
    <div id="statusBanner" class="status" style="display:none"></div>

    <div class="main">
      <div class="panel rooms">
        <div class="lobbySectionHead">
          <div>
            <span class="sectionKicker">MATCH LOBBY</span>
            <h1>함께할 방을 선택하세요</h1>
            <p>대기 중인 방에 참가하거나 새 게임을 시작할 수 있습니다.</p>
          </div>
          <button class="btn primary lobbyCreateBtn" id="openCreate2" type="button"><span aria-hidden="true">＋</span> 새 방 만들기</button>
        </div>
        <div class="tableWrap">
          <table>
            <colgroup>
              <col style="width:66px">
              <col style="width:110px">
              <col>
              <col style="width:56px">
              <col style="width:66px">
            </colgroup>
            <thead>
              <tr>
                <th class="col-status">상태</th>
                <th class="col-game">게임</th>
                <th class="col-title">방 제목</th>
                <th class="col-count">인원</th>
                <th class="col-join"></th>
              </tr>
            </thead>
            <tbody id="roomsBody"></tbody>
          </table>
        </div>

        <div class="legendRow">
          <div class="legendBadges">
            <span class="badge"><span class="dot ok"></span>대기</span>
            <span class="badge"><span class="dot danger"></span>게임중</span>
            <span class="badge"><span class="dot warn"></span>만석</span>
          </div>
          <span class="roomListHint">방을 누르면 바로 입장합니다.</span>
        </div>
</div>

      <div class="panel splitRight socialRail">
        <div class="panelHeader">
          <div>
            <h2>채팅</h2>
</div>
          <span class="badge"><span class="dot ok"></span>LIVE</span>
        </div>
        <div class="chatLog" id="chatLog"></div>
        <div class="chatInput">
          <input id="chatInput" placeholder="메시지 입력…" autocomplete="off"/>
          <button class="btn primary" id="chatSend">전송</button>
        </div>

        <div class="panelHeader" style="border-top:1px solid rgba(43,91,134,.55);">
          <div>
            <h2>접속자</h2>
</div>
          <div class="kpi" id="onlineKpi">접속 인원: <b>0</b>명</div>
        </div>
        <div class="userList" id="usersWrap"></div>
      </div>
    </div>
  </div>

  <!-- 방 만들기 -->
  <div class="modalBackdrop createRoomBackdrop" id="createModal" aria-hidden="true">
    <div class="modal createRoomModal" role="dialog" aria-modal="true" aria-labelledby="createRoomHeading">
      <div class="modalHeader createRoomHeader">
        <div class="createRoomTitleWrap">
          <span class="createRoomSpark" aria-hidden="true">✦</span>
          <div><b id="createRoomHeading">방 만들기</b><span>게임을 골라 친구들과 바로 시작해보세요.</span></div>
        </div>
        <button class="iconbtn createRoomClose" id="modalClose" aria-label="닫기" title="닫기">×</button>
      </div>
      <div class="modalBody createRoomBody">
        <div class="field createTitleField">
          <label for="roomTitle">방 제목</label>
          <div class="createTitleInputWrap">
            <input id="roomTitle" placeholder="예) 담탱이의 방" maxlength="30"/>
            <span class="roomTitleCount" id="roomTitleCount">0/30</span>
          </div>
        </div>

        <section class="createGameSection" aria-labelledby="createGameLabel">
          <div class="createSectionHead">
            <div><b id="createGameLabel">게임 선택</b><span>카드를 길게 누르면 게임 설명을 볼 수 있어요.</span></div>
            <span class="createHoldHint" aria-hidden="true">☝ 0.5초 길게</span>
          </div>
          <div class="createGameGrid" id="gameCardGrid" role="radiogroup" aria-label="게임 선택"></div>
          <div class="createGameInfo" id="gameHoldTip" aria-live="polite" hidden></div>
          <select id="gameMode" class="srOnly" tabindex="-1" aria-hidden="true"></select>
        </section>

        <section class="createSettingsSection">
          <div class="createSectionHead compact"><div><b>참여 인원</b><span id="maxClientsLabel">게임별 가능한 인원을 선택하세요.</span></div></div>
          <div class="playerCountChips" id="playerCountChips" role="radiogroup" aria-label="참여 인원"></div>
          <select id="maxClients" class="srOnly" tabindex="-1" aria-hidden="true"></select>
        </section>

        <div class="selectedGameSummary" id="selectedGameSummary" aria-live="polite"></div>
        <small class="createRoomNote">방을 만들면 자동으로 입장합니다. 게임·채팅 기록은 저장하지 않습니다.</small>
      </div>
      <div class="modalFooter createRoomFooter">
        <button class="btn createCancelBtn" id="createCancel">취소</button>
        <button class="btn primary createConfirmBtn" id="createConfirm"><span aria-hidden="true">✦</span> 방 만들기</button>
      </div>
    </div>
  </div>

    <!-- 로그인(필수) -->
  <div class="modalBackdrop" id="loginModal" aria-hidden="true">
    <div class="loginBrand" aria-hidden="true">
      <img src="./assets/images/myparty-logo.png" alt="마이파티" />
    </div>
    <div class="modal">
      <div class="modalHeader">
        <b>로그인</b>
        <span class="badge">최근 닉: <b id="lastNick">(없음)</b></span>
      </div>
      <div class="modalBody">
        <form id="loginForm" class="authForm">
          <div class="field">
            <label>아이디</label>
            <input id="loginUsername" autocomplete="username" placeholder="아이디"/>
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호"/>
          </div>
          <div class="authRow three">
            <button class="btn primary" type="submit">로그인</button>
            <button class="btn" type="button" id="guestBtn">게스트</button>
            <button class="btn" type="button" id="signupToggleBtn">회원가입</button>
          </div>
          <div id="loginStatus" class="muted" style="margin-top:8px;"></div>
          
        </form>

        <div id="signupArea" class="signupArea hidden">
          <hr style="border:none;border-top:1px solid rgba(43,91,134,.55); margin:10px 0;">
          <form id="signupForm" class="authForm">
            <div class="field">
              <label>회원가입 아이디</label>
              <input id="signupUsername" autocomplete="username" placeholder="아이디"/>
            </div>
            <div class="field">
              <label>회원가입 비밀번호</label>
              <input id="signupPassword" type="password" autocomplete="new-password" placeholder="비밀번호"/>
            </div>
            <div class="field">
              <label>닉네임(선택)</label>
              <input id="signupNickname" placeholder="채팅/게임 닉네임"/>
            </div>
            <div class="authRow">
              <button class="btn primary" type="submit">회원가입 완료</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen 지속을 위해: 전체화면 상태에서 방 입장 시 top-level 이동 대신 iframe 오버레이로 room.html을 표시 -->
  <div id="embedRoomOverlay" class="embedRoomOverlay hidden" aria-hidden="true">
    <iframe id="embedRoomFrame" title="room" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <script src="./js/core/config.js" defer></script>
  <script src="./js/auth/sheet-config.js" defer></script>
  <script src="./js/auth/auth.js" defer></script>
  <script src="./js/core/net.js?v=20260831-multigame1" defer></script>
  <script src="./js/core/audio.js" defer></script>
  <script src="./js/core/fullscreen-intent.js" defer></script>
  <script src="./js/games/registry.js" defer></script>
  <script src="./js/pages/lobby.js" defer></script>

  <audio id="bgmLobby" src="assets/audio/lobby_music.mp3" preload="auto" loop></audio>

</body>
</html>
