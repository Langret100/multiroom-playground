<body>
  <!-- 앱의 고정 뼈대. 기능 화면은 각 feature 모듈이 #viewHost에 렌더링합니다. -->
  <main id="launchView" class="launch-view">
    <section class="launch-card">
      <div id="launchDefault">
        <div class="app-mark app-mark-mascot"><img src="assets/mascot-avatar.png?v=64.5.1" alt=""></div>
        <h1>모아루</h1>
        <p>대화와 일상을 한곳에 모아주는 작은 공간</p>
        <button id="openPopupBtn" class="button primary">별도 창으로 열기</button>
        <button id="openPiPBtn" class="button secondary">항상 위로 열기</button>
        <div class="launch-inline">
          <button id="openHereBtn" class="button text">현재 창</button>
          <button id="installBtn" class="button text hidden">앱 설치(선택)</button>
        </div>
      </div>
      <div id="launchTransferred" class="launch-transferred hidden" role="status">
        <div class="transfer-mark" aria-hidden="true">↗</div>
        <h1>모아루가 새 창에서<br>실행 중이에요</h1>
        <p><span>이 페이지는 그대로 두고 자유롭게 인터넷을 이용하세요.</span><span>메신저는 새 창에서 계속 실행됩니다.</span></p>
      </div>
      <div id="popupControls" class="popup-controls hidden">
        <button id="focusPopupBtn" class="mini-action">창 앞으로</button>
        <button id="closePopupBtn" class="mini-action danger-lite">창 닫기</button>
      </div>
      <small id="launchMessage" class="muted"></small>
    </section>
  </main>

  <section id="appShell" class="app-shell hidden" aria-label="모아루">
    <header class="app-header">
      <button id="backBtn" class="icon-button hidden" aria-label="뒤로">‹</button>
      <div class="header-title">
        <button id="headerProfileButton" class="header-profile-button hidden" type="button" aria-label="내 프로필 설정" title="내 프로필 설정">
          <img class="header-profile-avatar" src="assets/mascot-avatar.png" alt="내 프로필">
        </button>
        <strong id="headerTitle">모아루</strong><span id="connectionBadge" class="connection-badge">준비</span>
      </div>
      <div id="headerActions" class="header-actions"></div>
    </header>

    <section id="authHost" class="auth-host"></section>

    <section id="workspace" class="workspace hidden">
      <nav id="sideRail" class="side-rail" aria-label="주요 메뉴"></nav>
      <main id="viewHost" class="view-host"></main>
      <nav id="bottomNav" class="bottom-nav" aria-label="주요 메뉴"></nav>
    </section>
  </section>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="notificationHost" class="notification-host" aria-live="assertive"></div>
  <div id="overlayHost" class="overlay-host" aria-live="assertive"></div>
