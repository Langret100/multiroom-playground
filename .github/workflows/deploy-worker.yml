name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf-worker
          command: deploy

      - name: Verify deployed protocol version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(node -e 'const fs=require("fs"); const s=fs.readFileSync("cf-worker/src/index.js","utf8"); const m=s.match(/const\\s+PROTOCOL_VERSION\\s*=\\s*["'\''`]([^"'\''`]+)["'\''`]/); if(!m) process.exit(2); process.stdout.write(m[1]);')"
          RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            'https://multiroom-playground.tmdrb445-f03.workers.dev/api/version')"
          ACTUAL="$(printf '%s' "$RESPONSE" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s); process.stdout.write(String(j.protocolVersion||""));});')"
          echo "Expected protocol: $EXPECTED"
          echo "Deployed protocol: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
